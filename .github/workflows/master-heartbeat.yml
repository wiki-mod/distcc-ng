name: Master weekly distributed heartbeat

# What: Weekly real-world validation for master -- builds ccache's own
#   source fully distributed across the same two-container harness the
#   nightly e2e uses, on a fixed cadence independent of whether master
#   changed.
# Why: Per-push health is already covered by c-build.yml; this adds only
#   the heavier external-project heartbeat, and (like any schedule/
#   workflow_dispatch trigger) has no effect until promoted to the
#   default branch.
# From: Issue #81, PR #86

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

env:
  # What: Single source of truth for the pinned ccache tag.
  # Why: Both the distributed build (client-heartbeat.sh) and the
  #   diagnostic control build (control-build.sh) must build the exact
  #   same revision, or a mismatch between them would look like a real
  #   distcc-ng bug.
  # From: PR #349
  CCACHE_HEARTBEAT_TAG: v4.13.6

jobs:
  ccache_heartbeat:
    runs-on: ubuntu-latest
    # What: Raised from the original 40, to give E2E_MAX_ATTEMPTS: "2"
    #   below room for a full second attempt.
    # Why: A timeout killing a retry mid-flight would silently discard
    #   the "real failure, not retrying further" exit path, misclassifying
    #   it as a worse failure than a single-attempt job would show.
    # From: PR #349
    timeout-minutes: 75
    steps:
      - uses: $/.github/actions/harden-runner
      # What: No ref override on checkout.
      # Why: This validates master, and schedule/dispatch already
      #   evaluate from master (the default branch).
      # From: PR #86
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What: Builds ccache distributed across the two-container harness
      #   via run-e2e.sh, the same orchestrator as the nightly e2e.
      # Why: docker/compose is already preinstalled on ubuntu-latest, so
      #   no setup step is needed; only the client workload changes, via
      #   E2E_CLIENT_SCRIPT.
      # From: PR #86
      - name: Build ccache distributed across the two-container harness
        env:
          E2E_CLIENT_SCRIPT: test/e2e/client-heartbeat.sh
          # What: A floor proving distribution actually happened.
          # Why: ccache has well over 20 translation units, so a genuine
          #   distributed build clears it easily, while a silently
          #   non-distributing build (launcher ignored) reports 0 and fails.
          # From: PR #86
          E2E_MIN_REMOTE_JOBS: "20"
          E2E_SCENARIO: ccache weekly heartbeat
          # What: One retry (2 total attempts) for this heavier weekly build.
          # Why: Absorbs a one-off network/container flake without hiding a
          #   real, reproducible bug -- run-e2e.sh only stops retrying early
          #   on success, so a recurring failure still fails; kept at 2 to
          #   stay inside timeout-minutes above with margin.
          # From: PR #349
          E2E_MAX_ATTEMPTS: "2"
        run: bash test/e2e/run-e2e.sh

  # What: Diagnostic-only control build: the same pinned ccache source
  #   with a plain compiler, entirely independent of distcc/distccd.
  # Why: Never gates ccache_heartbeat's own result (not in its needs:);
  #   only helps classify a same-run heartbeat failure as a real
  #   distcc-ng bug vs. a compiler/toolchain/ccache-version problem,
  #   which previously took real effort to untangle from the raw trace
  #   log alone.
  # From: Issue #263, PR #349
  ccache_control_build:
    name: Control build (plain compiler, no distcc) -- diagnostic only
    runs-on: ubuntu-latest
    # What: Same order of timeout budget as the heartbeat job itself, not
    #   a smaller one.
    # Why: This job gets a fresh runner (no shared image-layer cache) and
    #   still builds the e2e image plus a full ccache build from scratch;
    #   a timeout kill here would skip the always()-summary step and
    #   misclassify as exactly the ambiguous outcome this job exists to
    #   resolve.
    # From: PR #349
    timeout-minutes: 45
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the e2e image (same toolchain as the heartbeat job)
        run: docker compose -f test/e2e/docker-compose.yml build distccd-server
      - name: Build ccache directly inside the image, no distcc/distccd at all
        id: control_build
        continue-on-error: true
        run: |
          docker run --rm -e CCACHE_HEARTBEAT_TAG \
            distcc-ng-e2e:latest bash test/e2e/control-build.sh
      - name: Record classification in the job summary
        if: always()
        run: |
          {
            echo "### Control build (plain compiler, no distcc)"
            echo
            if [ "${{ steps.control_build.outcome }}" = "success" ]; then
              echo "ccache's source built cleanly with a plain compiler on this image, ruling out a plain source/toolchain incompatibility. If \`ccache_heartbeat\` failed in this run, that failure is not explained by a compiler/toolchain problem on unpreprocessed source alone -- it needs its own investigation (distcc preprocesses source before sending it, so a preprocessing-specific issue can still exist even when this plain build succeeds)."
            else
              echo "**ccache's source FAILED to build with a plain compiler, with distcc/distccd out of the loop entirely.** If \`ccache_heartbeat\` also failed in this run, the failure is very likely a compiler/toolchain/ccache-version problem (see issue #263) -- not a distcc-ng bug. See this job's own build step log above for the real compiler error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Surface this job's own pass/fail (does not affect ccache_heartbeat)
        if: steps.control_build.outcome != 'success'
        run: exit 1

  # What: Files/updates the standing nightly-broken issue on failure,
  #   closes it on success.
  # Why: Separate job with if: always() so it reports even when the
  #   heartbeat job itself failed.
  # From: Issue #81, PR #89
  report:
    needs: [ccache_heartbeat]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ needs.ccache_heartbeat.result == 'success' && 'success' || 'failure' }}
          scope: weekly ccache heartbeat (master)
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}
