name: CodeQL

# Scan current_dev and master branches on push/PR and weekly schedule.
# Replaces GitHub's Default Setup (which only scans master) with Advanced Setup
# to catch issues in our active development branch (current_dev).
# See: https://github.com/wiki-mod/distcc-ng/issues/155
on:
  workflow_dispatch:
  push:
    branches: [current_dev, master]
  pull_request:
    branches: [current_dev, master]
  schedule:
    # Weekly scan, scheduled for Sunday 05:00 UTC (does not conflict with
    # c-build.yml's 03:00 UTC or nightly-publish.yml's 04:00 UTC schedules).
    - cron: '0 5 * * 0'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

# Read-only floor: the actual write scope (security-events: write, needed to
# upload SARIF results) is pushed down to the analyze job's own permissions
# block below rather than granted here, so a top-level Scorecard/security
# scan of this file sees no broader-than-read default token scope.
permissions:
  contents: read

jobs:
  # `Analyze (c-cpp/python/actions)` are all required status checks on
  # master's ruleset, so -- same lesson as c-build.yml (refs #267/#336) --
  # any gating here has to keep all three check-runs genuinely present,
  # not skip the whole workflow via a path filter. This job computes one
  # relevant/not-relevant flag per language so each matrix leg can skip
  # its own real work independently while still reporting a green
  # check-run under its exact required name.
  #
  # That handles required_status_checks, but master's ruleset also has a
  # second, independent native rule -- "Require code scanning results"
  # (code_scanning_tools: CodeQL, alerts_threshold: all) -- which checks
  # for an actual uploaded SARIF analysis per language, not a check-run's
  # conclusion. A language this job marks not-relevant never calls
  # codeql-action/analyze, so it never uploads anything; its check-run is
  # a green skip, but the native rule still sees zero results for that
  # language and blocks merge ("Code scanning is still expecting N
  # results from CodeQL"), independent of every check-run's own outcome.
  # Confirmed live on PR #426. So the `filter` step below forces all three
  # languages relevant whenever the target branch is master, regardless
  # of what actually changed -- current_dev has no such ruleset rule and
  # keeps the real path-filtered optimization.
  changes:
    name: Detect relevant changes per CodeQL language
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      c_cpp: ${{ steps.filter.outputs.c_cpp }}
      python: ${{ steps.filter.outputs.python }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      # Same "cheap checkout + git diff" shape as c-build.yml's own `changes`
      # job (issue #361's "if cheap" cost/benefit call) -- added here too for
      # consistency rather than leaving an identical job pattern half-covered.
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        uses: $/.github/actions/changed-files
      - id: filter
        env:
          FORCED: ${{ steps.diff.outputs.forced }}
          CHANGED: ${{ steps.diff.outputs.changed_files }}
          # PR base branch for pull_request events, current branch name for
          # push events -- either way, "what branch is this commit landing
          # on".
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$FORCED" = "true" ]; then
            {
              echo "c_cpp=true"
              echo "python=true"
              echo "actions=true"
            } >> "$GITHUB_OUTPUT"
            echo "forced (workflow_dispatch/schedule/no diffable base) -- always runs the full scan"
            exit 0
          fi
          # master's own ruleset has a native "Require code scanning
          # results" rule (code_scanning_tools: CodeQL, alerts_threshold:
          # all) -- a completely separate mechanism from the
          # required_status_checks list above. That rule checks whether an
          # actual SARIF analysis was uploaded for the commit, per
          # language; a language skipped via this job's path filter never
          # calls codeql-action/analyze at all, so it never uploads
          # anything, even though its own check-run still shows green
          # (skipped, not failed). required_status_checks is satisfied by
          # the green skip; the native code_scanning rule is not -- it
          # blocks merge with "Code scanning is still expecting N results
          # from CodeQL" regardless of the check-run's own conclusion.
          # Confirmed live on PR #426 (a .github/workflows + CHANGELOG.md
          # only diff against master): permanently merge-blocked this way
          # even with all three Analyze checks green. So a target of
          # master always gets the full, unskipped scan; current_dev has
          # no such ruleset rule and keeps the path-filtered optimization.
          if [ "$TARGET_BRANCH" = "master" ]; then
            {
              echo "c_cpp=true"
              echo "python=true"
              echo "actions=true"
            } >> "$GITHUB_OUTPUT"
            echo "targeting master -- its ruleset requires real CodeQL results for every language on every commit, never skip"
            exit 0
          fi
          # c-cpp: anything CodeQL's manual C build step below actually
          # compiles or that configure/make read to produce it.
          if printf '%s\n' "$CHANGED" | grep -qE '^(src|lzo|popt|include_server/c_extensions|test/fuzz|m4)/|^(configure\.ac|Makefile\.in|autogen\.sh)$|\.(c|h|cc|cpp)$'; then
            echo "c_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "c_cpp=false" >> "$GITHUB_OUTPUT"
          fi
          # python: the include-server and its tests, plus any stray .py
          # elsewhere (e.g. scripts/) as a catch-all.
          if printf '%s\n' "$CHANGED" | grep -qE '^(include_server|test)/|\.py$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          # actions: workflow YAML plus this repo's one composite action
          # (.github/actions/nightly-status).
          if printf '%s\n' "$CHANGED" | grep -qE '^\.github/(workflows|actions)/'; then
            echo "actions=true" >> "$GITHUB_OUTPUT"
          else
            echo "actions=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Deliberately excluded from issue #361's fix (caveat 3): a real
    # cost/benefit call left to the maintainer, not bundled into this pass.
    # actions: read lets codeql-action/init resolve this workflow's own run
    # context (needed on some repo configurations); security-events: write
    # is what actually lets codeql-action/analyze upload SARIF results to
    # the code scanning API -- both scoped to this job, not the whole
    # workflow, since it's the only job that calls either.
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, actions]

    steps:
      # No job-level `if:` on this job (see the `changes` job's own
      # comment) -- a matrixed job's `if:` is evaluated before the matrix
      # expands, which would collapse all three legs into a single
      # unnamed "analyze" check-run instead of the three exact contexts
      # (Analyze (c-cpp)/(python)/(actions)) master's ruleset requires.
      # This step instead picks out just this leg's own relevance from
      # the `changes` job's three outputs, so every later step can gate
      # on one flag regardless of which language this matrix leg is.
      - id: gate
        env:
          LANG_RELEVANT: ${{ matrix.language == 'c-cpp' && needs.changes.outputs.c_cpp || matrix.language == 'python' && needs.changes.outputs.python || needs.changes.outputs.actions }}
        run: echo "relevant=$LANG_RELEVANT" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        if: steps.gate.outputs.relevant == 'true'
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # Use extended query suite (security + code quality checks)
          queries: security-extended

      # For c-cpp, we must manually build since CodeQL's autobuild cannot
      # reliably handle autoconf/automake projects. Follow the same build
      # pattern as c-build.yml (without ccache overhead, which is not needed
      # for a one-off CodeQL scan).
      - name: Install dependencies (C/C++ only)
        if: steps.gate.outputs.relevant == 'true' && matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake \
            libavahi-client-dev libpopt-dev \
            python3-dev python3-setuptools

      - name: Build (C/C++ only)
        if: steps.gate.outputs.relevant == 'true' && matrix.language == 'c-cpp'
        run: |
          ./autogen.sh
          ./configure PYTHON=python3
          make

      - name: Perform CodeQL Analysis
        if: steps.gate.outputs.relevant == 'true'
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: '/language:${{ matrix.language }}'
