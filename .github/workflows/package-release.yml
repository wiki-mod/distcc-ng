name: Package release

concurrency:
  group: package-release-${{ github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      publish_container:
        description: "Build (and push) the container image even without a real release tag, for testing"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Read-only floor: this file's real write scopes (contents: write for the
# GitHub release, packages: write for the GHCR image pushes, id-token/
# attestations: write for build provenance) are each pushed down to only the
# specific job that actually uses them, rather than granted to every job in
# this pipeline -- setup, build_check, and distributed_e2e never call the
# GitHub API or push anything and previously inherited all four scopes for
# no reason.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    # Pure metadata derivation (parses github.ref/github.run_number into
    # step outputs) -- no checkout, no GitHub API call, no registry access.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_title: ${{ steps.meta.outputs.release_title }}
      image_base: ${{ steps.meta.outputs.image_base }}
      pump_image_base: ${{ steps.meta.outputs.pump_image_base }}
      do_container: ${{ steps.meta.outputs.do_container }}
      # Resolved once here rather than let build_container and
      # publish_manifest each re-evaluate github.run_attempt in their own
      # job context -- see issue #363. build_container is a matrix job
      # (variant x platform), so giving IT a run_attempt output would hit a
      # separate GitHub Actions sharp edge: a matrix job's own `outputs:`
      # get overwritten by whichever leg finishes last, not merged. That
      # overwrite would actually be harmless here (every leg would write the
      # identical attempt number), but resolving it once in this
      # non-matrixed job -- which is already a `needs:` of both
      # build_container and publish_manifest -- avoids relying on that
      # reasoning at all, which is the more honest fix per issue #363.
      #
      # Empirically confirmed (issue #363) that this is safe across a
      # "Re-run failed jobs" retry, using a scratch probe workflow
      # (PR #423, closed unmerged) with two jobs A->B: A always succeeds, B
      # deliberately fails on attempt 1 then is rerun. Attempt 2's run
      # https://github.com/wiki-mod/distcc-ng/actions/runs/31043025532
      # (attempt 2) showed job B, running fresh with its own
      # github.run_attempt == '2', reading needs.A.outputs.producer_attempt
      # == '1' -- the value A set while it actually ran, in attempt 1, even
      # though A itself was NOT re-run. So a job's outputs from a
      # not-re-run attempt genuinely survive into later attempts via the
      # `needs` context; reading needs.setup.outputs.run_attempt from both
      # build_container and publish_manifest below is exactly this
      # property, applied to setup instead of build_container. This also
      # resolves the same open question PR #354's 7207b01 left unverified
      # for e2e-image-build.yml.
      #
      # This value only ever changes if setup itself is re-run, which
      # "Re-run failed jobs" never does once setup has succeeded (it almost
      # always does, being pure string handling with no external
      # dependency). GitHub's job-rerun API docs state that re-running a job
      # also re-runs the jobs that depend on it -- not independently tested
      # here, only relied on by inference -- so a deliberate, out-of-band
      # rerun of just this job would be expected to cascade to
      # build_container and publish_manifest too, keeping all three in
      # step; see the "Upload this run's digest" step below for the one
      # narrower rerun shape (a single already-succeeded matrix leg,
      # forced in isolation) that neither this fix nor the prior code
      # actually covers.
      run_attempt: ${{ steps.meta.outputs.run_attempt }}
    steps:
      # Trial run (#58): audit-only egress monitoring, does not block any
      # traffic yet. Must be the very first step in every job -- it can't
      # retroactively cover network calls made by steps that already ran.
      - uses: $/.github/actions/harden-runner
      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            release_title="distcc-ng ${GITHUB_REF_NAME}"
          else
            version="manual-${GITHUB_RUN_NUMBER}"
            release_title="distcc-ng manual-${GITHUB_RUN_NUMBER}"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ inputs.publish_container }}" = "true" ]; then
            do_container=true
          else
            do_container=false
          fi
          {
            printf 'version=%s\n' "${version}"
            printf 'tag_name=%s\n' "${GITHUB_REF_NAME}"
            printf 'release_title=%s\n' "${release_title}"
            printf 'image_base=ghcr.io/%s/distcc-ng:%s\n' "${GITHUB_REPOSITORY_OWNER}" "${version}"
            printf 'pump_image_base=ghcr.io/%s/distcc-ng-pump:%s\n' "${GITHUB_REPOSITORY_OWNER}" "${version}"
            printf 'do_container=%s\n' "${do_container}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_OUTPUT}"

  # --- Gate 1: real build + full make check before release ------------------
  build_check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job only checks out the tag and runs a local build + test -- no
    # GitHub API or registry write of any kind.
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-dir
    steps:
      # Trial run (#58): audit-only egress monitoring, see the setup job's
      # identical first step for the full rationale.
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/build-and-check
        with:
          cache-key-prefix: ccache-release
          autoconf-cache-key-prefix: autoconf-release

  # --- Gate 2: real distributed-compile e2e before release ------------------
  distributed_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job only checks out the tag and runs the local docker-compose e2e
    # script -- no GitHub API or registry write of any kind.
    permissions:
      contents: read
    steps:
      # Trial run (#58): audit-only egress monitoring, see the setup job's
      # identical first step for the full rationale.
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: $/.github/actions/distributed-e2e-test

  build_packages:
    needs: [setup, build_check, distributed_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # contents: read for checkout; id-token/attestations: write are what
    # actions/attest-build-provenance below actually needs to mint and
    # record its provenance attestation -- this job never pushes to GHCR or
    # touches the GitHub Releases API, so it gets neither packages: write
    # nor contents: write.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Trial run (#58): audit-only egress monitoring, see the setup job's
      # identical first step for the full rationale.
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: $/.github/actions/install-packaging-deps

      - name: Build release packages
        shell: bash
        run: |
          ./scripts/build-release-packages.sh

      - name: Locate the built source tarball
        # anchore/sbom-action's `file:` input needs one concrete path, not a
        # glob -- resolve the actual tarball name build-release-packages.sh
        # just produced (distcc-<version>.tar.gz, see Makefile.in's
        # tarball/tarball_gz definitions) so the SBOM step below scans the
        # exact release asset rather than guessing its name.
        id: source_tarball
        shell: bash
        run: |
          tarball="$(find . -maxdepth 1 -name 'distcc-*.tar.gz' -print -quit)"
          tarball="${tarball#./}"
          [ -n "${tarball}" ] || { echo "::error::no distcc-*.tar.gz produced by build-release-packages.sh" >&2; exit 1; }
          printf 'path=%s\n' "${tarball}" >> "${GITHUB_OUTPUT}"

      - name: Generate SBOM for release artifacts
        # OSPS-QA-02.02 (OpenSSF Best Practices Baseline): compiled release
        # assets must ship with a software bill of materials. Scans the
        # actual source tarball being released (the same artifact uploaded
        # to the GitHub release below) rather than the live build
        # directory, so the SBOM describes exactly what a downstream
        # consumer receives.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.source_tarball.outputs.path }}
          format: spdx-json
          output-file: distcc-ng-${{ needs.setup.outputs.version }}.spdx.json
          artifact-name: distcc-ng-${{ needs.setup.outputs.version }}.spdx.json
          upload-release-assets: false

      - name: Generate build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            distcc-*.tar.gz
            distcc-*.tar.bz2
            packaging/*.rpm
            packaging/*.deb
            distcc-ng-*.spdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distcc-release-packages-${{ needs.setup.outputs.version }}
          path: |
            distcc-*.tar.gz
            distcc-*.tar.bz2
            packaging/*.rpm
            packaging/*.deb
            distcc-ng-*.spdx.json

  build_container:
    needs: [setup, build_check, distributed_e2e]
    if: needs.setup.outputs.do_container == 'true'
    # contents: read for checkout; packages: write for the GHCR login and
    # push below. Trivy/SBOM steps only inspect the already-built local
    # image and upload a workflow artifact, neither of which needs any
    # additional token scope -- this job never touches the Releases API or
    # mints a provenance attestation, so it gets neither contents: write nor
    # id-token/attestations: write.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [plain, pump]
        # platform must be a real matrix axis (not bare `include` entries
        # with no variant key) -- an `include` entry that doesn't specify
        # every existing axis key doesn't merge per-combination, it instead
        # overwrites the added key for every generated job in list order,
        # so the previous plain `include: [{platform: amd64...}, {platform:
        # arm64...}]` silently made every job build arm64 only (the last
        # entry wins), and amd64 -- documented as the required leg --
        # never actually built. Caught live: publish_manifest's "Create
        # multi-arch manifest" step failed with "digest-plain-amd64.txt:
        # No such file or directory" since no amd64 leg had ever run.
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runs_on: ubuntu-latest
          - platform: arm64
            runs_on: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runs_on }}
    # fail-fast: false only stops one leg's failure from cancelling the
    # others -- it does NOT stop a failed leg from making this job's own
    # overall result "failure", which needs: [build_container] downstream
    # (publish_manifest) treats as blocking. arm64 is documented above as
    # best-effort; continue-on-error is what actually makes that true --
    # an arm64 failure is reported (not silently green) but no longer
    # blocks the amd64 leg or downstream publish jobs, for either variant.
    # publish_manifest itself independently confirms the arm64 image is
    # actually present in the registry before including it in the
    # multi-arch manifest, so a continue-on-error'd arm64 failure degrades
    # to an amd64-only manifest rather than a broken multi-arch one.
    continue-on-error: ${{ matrix.platform == 'arm64' }}
    steps:
      # Trial run (#58): audit-only egress monitoring, see the setup job's
      # identical first step for the full rationale.
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve this leg's image tag and Dockerfile target
        # variant/platform live in the matrix; the image base (which
        # differs per variant -- distcc-ng vs the separate distcc-ng-pump
        # package, issue #181) doesn't, since matrix entries can't
        # reference job outputs directly.
        id: leg
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "pump" ]; then
            image_base="${{ needs.setup.outputs.pump_image_base }}"
            dockerfile_target="runtime-pump"
          else
            image_base="${{ needs.setup.outputs.image_base }}"
            dockerfile_target="runtime"
          fi
          {
            printf 'image_tag=%s-%s\n' "${image_base}" "${{ matrix.platform }}"
            printf 'dockerfile_target=%s\n' "${dockerfile_target}"
          } >> "${GITHUB_OUTPUT}"

      - uses: $/.github/actions/ghcr-login
        with:
          token: ${{ github.token }}

      - name: Build ${{ matrix.variant }} ${{ matrix.platform }} image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.leg.outputs.image_tag }}
          DOCKERFILE_TARGET: ${{ steps.leg.outputs.dockerfile_target }}
          VERSION_LABEL: ${{ needs.setup.outputs.version }}
          VCS_REF: ${{ github.sha }}
        run: |
          docker build \
            --platform "linux/${{ matrix.platform }}" \
            --file docker/release/Dockerfile \
            --target "${DOCKERFILE_TARGET}" \
            --build-arg "VCS_REF=${VCS_REF}" \
            --build-arg "VERSION=${VERSION_LABEL}" \
            --tag "${IMAGE_TAG}" \
            .

      - name: Prepare local Trivy cache
        run: mkdir -p "/var/tmp/distcc-ng-trivy-cache/${{ matrix.variant }}/${{ matrix.platform }}"

      - name: Scan image with Trivy
        # Scans the locally-built image before it's ever pushed -- a
        # vulnerable image never reaches the registry. Pattern and options
        # match wiki-mod/lancache-ng's real, working setup.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.leg.outputs.image_tag }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          hide-progress: true
          cache: "false"
          cache-dir: /var/tmp/distcc-ng-trivy-cache/${{ matrix.variant }}/${{ matrix.platform }}
          timeout: 10m
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.leg.outputs.image_tag }}
          format: spdx-json
          artifact-name: distcc-ng-${{ matrix.variant }}-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.spdx.json

      - name: Push ${{ matrix.variant }} ${{ matrix.platform }} image
        id: push
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.leg.outputs.image_tag }}
        run: docker push "${IMAGE_TAG}"

      - name: Record this run's pushed digest
        # Recording *this run's* digest (not just checking whether a tag by
        # this name exists in the registry) is what makes the arm64 leg's
        # continue-on-error actually safe: a rerun of this workflow for the
        # same version tag, after an EARLIER successful arm64 push followed
        # by a NEW failing arm64 attempt, would otherwise still find the
        # old, stale arm64 tag sitting in the registry under the same
        # mutable name and wrongly pair it with the current amd64 build in
        # the manifest. Only reached when the push step above succeeded, so
        # a failed/continued-past arm64 leg never uploads a digest here --
        # publish_manifest below only trusts a digest artifact actually
        # produced by this run, not the mutable tag's current registry
        # state.
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.leg.outputs.image_tag }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_TAG}" --format '{{json .Manifest}}' | \
                     python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          printf '%s\n' "${digest}" > "digest-${{ matrix.variant }}-${{ matrix.platform }}.txt"

      - name: Upload this run's digest
        # Artifact name includes an attempt discriminator: GitHub's v4
        # artifacts can be fetched across previous attempts of the same run
        # unless explicitly scoped, so an unscoped name could resolve a
        # stale, earlier attempt's digest artifact instead of this run's own
        # -- the stale-pairing risk this digest mechanism exists to prevent,
        # just moved from the registry tag to the artifact store.
        #
        # Deliberately needs.setup.outputs.run_attempt (issue #363), NOT
        # this job's own github.run_attempt -- see that job output's comment
        # for the empirical confirmation that a not-re-run job's output
        # really does survive a rerun, and for why this sidesteps a matrix
        # job's own overwritten-outputs sharp edge.
        #
        # Why this still closes the original stale-pairing gap despite the
        # suffix no longer changing on every attempt: "Re-run failed jobs"
        # (the actual failure mode in #363) never re-executes a leg whose
        # own conclusion was already success, and arm64's continue-on-error
        # above means even a *failing* arm64 build is reported success --
        # so within one run, each leg's upload step runs at most once across
        # every attempt, and it always runs before setup could ever have
        # been forced to produce a second, different run_attempt value.
        # Every artifact that exists for this run therefore carries the one
        # value setup resolved, and there is no earlier-attempt duplicate of
        # the same name to collide with.
        # Residual sharp edge, not fully closed by either the old or this
        # scheme: manually force-rerunning one already-succeeded matrix leg
        # in isolation (GitHub's per-job rerun, not "Re-run failed jobs")
        # re-executes only that leg -- its sibling legs' artifacts, and
        # setup's output, are untouched either way, so a maintainer doing
        # this deliberately should expect to need a full rerun instead.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.variant }}-${{ matrix.platform }}-${{ needs.setup.outputs.run_attempt }}
          path: digest-${{ matrix.variant }}-${{ matrix.platform }}.txt

  publish_manifest:
    needs: [setup, build_container]
    if: needs.setup.outputs.do_container == 'true'
    # No checkout in this job (it only assembles a multi-arch manifest from
    # already-pushed per-platform images); packages: write is what the GHCR
    # login and the final `docker buildx imagetools create` push need.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [plain, pump]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      # Trial run (#58): audit-only egress monitoring, see the setup job's
      # identical first step for the full rationale.
      - uses: $/.github/actions/harden-runner
      - uses: $/.github/actions/ghcr-login
        with:
          token: ${{ github.token }}

      - name: Download this run's image digests
        # continue-on-error: true so a rerun where arm64 failed (and never
        # uploaded its digest artifact, see build_container's "Record this
        # run's pushed digest" step) doesn't fail this job -- amd64-only is
        # the intended degraded outcome, not an error.
        #
        # Pattern deliberately reads needs.setup.outputs.run_attempt, NOT
        # this job's own github.run_attempt (issue #363, fixed the same way
        # PR #354/7207b01 fixed e2e-image-build.yml): on a "Re-run failed
        # jobs" where build_container already succeeded and only this job
        # failed, build_container is not re-run while THIS job's own attempt
        # number still increments, so re-deriving the pattern from
        # github.run_attempt here would search for an artifact name no
        # attempt ever produced, permanently and un-recoverably -- the exact
        # bug this issue is about. needs.setup.outputs.run_attempt instead
        # names the attempt setup itself last actually ran in, which is
        # exactly the same value build_container's upload step used, since
        # both read it from the same not-re-run job's carried-over output.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-digest-${{ matrix.variant }}-*-${{ needs.setup.outputs.run_attempt }}
          path: digests
          merge-multiple: true

      - name: Create multi-arch manifest
        shell: bash
        env:
          IMAGE_BASE: ${{ matrix.variant == 'pump' && needs.setup.outputs.pump_image_base || needs.setup.outputs.image_base }}
        run: |
          set -euo pipefail
          # arm64 is best-effort (continue-on-error in build_container, see
          # that job's comment) -- its own leg can fail while amd64 still
          # succeeds. Reference each platform by the DIGEST this specific
          # run recorded, never by the mutable "-amd64"/"-arm64" tag: a
          # rerun of this workflow for the same version tag, after an
          # earlier successful arm64 push followed by a new failing arm64
          # attempt, would otherwise still find the OLD arm64 tag sitting
          # in the registry and wrongly pair it with the current amd64
          # build. A digest artifact only exists if build_container's push
          # step for that platform actually ran and succeeded in this exact
          # run, so a missing file here means the best-effort arch is
          # genuinely absent from this run, not just momentarily unfound.
          amd64_digest="$(cat "digests/digest-${{ matrix.variant }}-amd64.txt")"
          tags=("${IMAGE_BASE}@${amd64_digest}")
          if [ -f "digests/digest-${{ matrix.variant }}-arm64.txt" ]; then
            arm64_digest="$(cat "digests/digest-${{ matrix.variant }}-arm64.txt")"
            tags+=("${IMAGE_BASE}@${arm64_digest}")
          else
            # A notice, not a warning: amd64-only degradation on a missing
            # best-effort arm64 leg is the *intended* outcome of making
            # that leg continue-on-error, not a fault -- this repo's
            # warning-as-error rule (AGENTS.md rule 31) governs unexpected
            # problems, not a documented, deliberate degradation path.
            echo "::notice::no arm64 digest recorded by this run (best-effort leg failed or was skipped); publishing amd64-only manifest"
          fi
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}" \
            "${tags[@]}"

          # Move the floating `latest` tag to this release too, alongside
          # the immutable version tag above -- only on a real tag push
          # (github.ref_type == 'tag'), never on a manual/workflow_dispatch
          # test build (which would otherwise clobber `latest` with an
          # untagged, unreleased "manual-N" build). This doesn't relax
          # doc/release-versioning.md's "no release may ever be untagged"
          # rule: `latest` is a second, additional pointer at the exact
          # same already-versioned manifest, not a replacement for the
          # real <version>-NG tag, which is still what every immutable
          # reference (the GitHub Release, the SBOM, this job's own digest
          # pins) actually names. Simplifying assumption: this repo
          # currently maintains one linear release train (no parallel
          # maintenance branches releasing older major versions), so "most
          # recently tagged" and "newest version" are always the same tag
          # -- revisit this if that ever changes.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            latest_tag="${IMAGE_BASE%:*}:latest"
            docker buildx imagetools create \
              --tag "${latest_tag}" \
              "${tags[@]}"
          fi

  publish_github_release:
    needs: [setup, build_packages, publish_manifest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # No checkout in this job (it only downloads the already-built package
    # artifact); contents: write is what the `gh release create/upload/edit`
    # calls below actually need -- this job never pushes to GHCR or mints an
    # attestation, so it gets neither packages: write nor id-token/
    # attestations: write.
    permissions:
      contents: write
    steps:
      # Trial run (#58): audit-only egress monitoring, see the setup job's
      # identical first step for the full rationale.
      - uses: $/.github/actions/harden-runner
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distcc-release-packages-${{ needs.setup.outputs.version }}

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_base }}
          PUMP_IMAGE_TAG: ${{ needs.setup.outputs.pump_image_base }}
          RELEASE_TITLE: ${{ needs.setup.outputs.release_title }}
          TAG_NAME: ${{ needs.setup.outputs.tag_name }}
        run: |
          shopt -s nullglob
          assets=(distcc-*.tar.gz distcc-*.tar.bz2 packaging/*.rpm packaging/*.deb distcc-ng-*.spdx.json)

          notes_file="$(mktemp)"
          {
            printf '%s\n\n' "${RELEASE_TITLE}"
            printf 'See CHANGELOG.md for the full list of changes in this release.\n\n'
            printf 'Source commit: %s\n' "${GITHUB_SHA}"
            printf 'Tag: %s\n\n' "${TAG_NAME}"
            printf 'Container image: %s\n' "${IMAGE_TAG}"
            printf 'Container image (pump mode, issue #181): %s\n' "${PUMP_IMAGE_TAG}"
          } > "${notes_file}"

          if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --repo "${{ github.repository }}" --clobber
            gh release edit "${TAG_NAME}" --repo "${{ github.repository }}" --title "${RELEASE_TITLE}" --notes-file "${notes_file}" --latest
          else
            gh release create "${TAG_NAME}" "${assets[@]}" --repo "${{ github.repository }}" --title "${RELEASE_TITLE}" --notes-file "${notes_file}" --latest
          fi
