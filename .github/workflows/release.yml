# distcc-ng (https://github.com/wiki-mod/distcc-ng)
# SPDX-License-Identifier: GPL-2.0-or-later
# What: Release: build/test/package/publish/changelog/draft.
# Why: Tag cut is dispatch-only; draft/changelog are live.
# From: Issue #479
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v3.6.6-NG (must match configure.ac)"
        required: true
        type: string
  release:
    types: [published]
  push:
    branches: [current_dev]

permissions:
  contents: read

jobs:
  update_changelog:
    name: Insert release notes into CHANGELOG.md
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/current_dev/.github/scripts/ci.sh" | bash -s -- checkout 0 current_dev
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          notes="$(mktemp)"
          printf '%s' "${{ toJSON(github.event.release.body) }}" | jq -r . > "$notes"
          bash .github/scripts/ci.sh publish changelog "$TAG" "$notes"

  update_draft_release:
    name: Refresh the current_dev draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/ci.sh publish draft-release

  build_test:
    name: Build + test (default)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - uses: ./.github/actions/install-build-deps
      - env:
          VARIANT: default
        run: bash .github/scripts/ci.sh build "$VARIANT"
      - env:
          VARIANT: default
        run: bash .github/scripts/ci.sh test "$VARIANT"

  e2e:
    name: Distributed compile E2E (2-container)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - run: bash .github/scripts/ci.sh e2e distributed

  package:
    name: Build packages and publish GitHub release
    needs: [build_test, e2e]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - uses: ./.github/actions/install-packaging-deps
      - run: bash .github/scripts/ci.sh package
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash .github/scripts/ci.sh publish github-release "$TAG"

  build_container:
    name: Build ${{ matrix.variant }} ${{ matrix.platform }} image
    needs: [build_test, e2e]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.platform == 'arm64' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, pump]
        platform: [amd64, arm64]
    env:
      IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/distcc-ng${{ matrix.variant == 'pump' && '-pump' || '' }}:${{ inputs.tag }}-${{ matrix.platform }}
      VERSION: ${{ inputs.tag }}
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - uses: ./.github/actions/ghcr-login
        with:
          token: ${{ github.token }}
      - env:
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/ci.sh container "$VARIANT" "$PLATFORM"

  publish_manifest:
    name: Publish ${{ matrix.variant }} multi-arch manifest
    needs: [build_container]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, pump]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/distcc-ng${{ matrix.variant == 'pump' && '-pump' || '' }}:${{ inputs.tag }}
    steps:
      - uses: ./.github/actions/ghcr-login
        with:
          token: ${{ github.token }}
      - env:
          VARIANT: ${{ matrix.variant }}
        run: bash .github/scripts/ci.sh publish manifest "$VARIANT"
