name: Verification container build+test

# Builds docker/verify/Dockerfile (issue #264) and proves it real: the image
# build's own self-test RUN step already fails the build if a baked-in tool
# is missing or non-functional (see the Dockerfile), so a green build here is
# itself part of the evidence. This workflow adds the checks that can't run
# inside `docker build` (ptrace-dependent tools, a real distcc-ng
# ./autogen.sh && ./configure && make && make check run against this repo's
# own source, and a real Samba ./configure dry-run to prove the Samba-sized
# dependency inventory is actually sufficient) -- run here because this
# development machine has no local Docker (WSL2 is banned for cited
# verification evidence per this repo's standing rule), so CI is the real,
# honest verification environment for this change, matching AGENTS.md rule
# 32's preference for CI over an unverifiable local claim.
#
# On a pull_request, only build_and_selftest runs (proves the Dockerfile/image
# still work) -- publish is skipped for PRs so a PR can never push a package.
# On push to current_dev (or a manual workflow_dispatch), publish also runs,
# rebuilding the now-proven image and pushing it to GHCR as
# distcc-ng-buildtools:latest (own package, separate from distcc-ng/
# distcc-ng-nightly), so pulling and starting the image is the entire setup
# step (issue #264's own "pre-built, fully self-contained" requirement) rather
# than every user needing a local `docker build`.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - current_dev
    paths:
      - 'docker/verify/**'
      - '.github/workflows/verify-image-build.yml'
  # See c-build.yml's pull_request block for why ready_for_review is
  # listed explicitly.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docker/verify/**'
      - '.github/workflows/verify-image-build.yml'

permissions:
  contents: read

jobs:
  build_and_selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Ephemeral, CI-local Redis for the ccache-remote-storage self-test step
    # below -- this is a throwaway container that only exists for this job
    # run, entirely unrelated to the maintainer's own real CCACHE_REMOTE_STORAGE
    # repo secret (a private LAN Redis instance GitHub-hosted runners cannot
    # reach anyway, and never referenced anywhere in this workflow). Proving
    # ccache's Redis remote-storage integration actually works is valuable on
    # its own merits: per the maintainer, a shared Redis-backed remote cache
    # is the single most common real-world ccache deployment shape.
    #
    # GitHub Actions' `services:` block has no dedicated memory-limit field
    # (verified against GitHub's own workflow-syntax and service-container
    # docs -- neither documents one). `options:` does forward arbitrary
    # `docker create` flags to the service container (documented for the
    # sibling `jobs.<job_id>.container.options` key, which explicitly points
    # at Docker's own `docker create` option list; `services.<id>.options`
    # is the same mechanism applied to a service container), so the
    # maintainer's ~2GB ask is expressed as a real `docker create` flag
    # (`--memory=2g`) here rather than skipped.
    #
    # `ports: ['6379:6379']` binds Redis to a fixed, known host port
    # (rather than the random-port form, which would require reading
    # `job.services.redis.ports.6379` back out at runtime) specifically so
    # the self-test step below has one real, verified address
    # (127.0.0.1:6379) to hand to CCACHE_REMOTE_STORAGE without guessing.
    services:
      redis:
        image: redis:alpine
        options: >-
          --memory=2g
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build docker/verify/Dockerfile
        # The image build's own embedded self-test RUN step (gcc/clang,
        # ASan, UBSan, valgrind, binutils, ripgrep/grep/less, ccache) already
        # fails this step on any tool regression -- see the Dockerfile.
        run: |
          docker build -f docker/verify/Dockerfile -t distcc-ng-verify:ci .

      - name: Ptrace-dependent tool self-test (gdb/strace/ltrace)
        # Logic lives in docker/verify/ci.sh's step_ptrace_selftest() (Issue #285).
        run: bash docker/verify/ci.sh ptrace-selftest

      - name: Prepare a resolvable passwd/group entry for the runner's own uid
        # SSHMode_Case (test/testdistcc.py) calls ssh-keygen twice in its
        # setup(), and OpenSSH's ssh-keygen unconditionally calls
        # getpwuid(getuid()) early in main() (it needs pw_name/pw_dir for
        # the default key comment and tilde-expansion, even though -f is
        # always given here) -- fatal()ing with "No user exists for uid
        # <uid>" when that lookup returns NULL. The "Real distcc-ng
        # build+test inside the image" step below runs as
        # `--user "$(id -u):$(id -g)"` (the runner's own numeric uid, e.g.
        # 1001), which the image's /etc/passwd has no entry for -- the same
        # "Docker does not synthesize a passwd entry for a numeric --user"
        # gotcha that step's own $HOME comment already documents, just
        # hitting getpwuid() instead of $HOME this time. Confirmed live in
        # CI: make check's SSHMode_Case failed with exactly this fatal()
        # message once PR #443 added openssh to this image, since
        # ssh-keygen is the first tool in this whole step to actually call
        # getpwuid() on the runner's own uid.
        #
        # Fixed by reading the image's own real /etc/passwd and /etc/group
        # (so every entry the image itself ships -- root, verify, system
        # accounts -- is preserved), appending one synthetic entry for
        # $(id -u)/$(id -g), and bind-mounting the result over /etc/passwd
        # and /etc/group (read-only) for that step's docker run. This keeps
        # the no-root/no-chown/no-su property issue #286 already
        # established -- no image rebuild, no new package, no privilege
        # change, just a resolvable name for a uid that already owns the
        # bind-mounted workspace.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/verify-etc"
          docker run --rm distcc-ng-verify:ci cat /etc/passwd > "${RUNNER_TEMP}/verify-etc/passwd"
          docker run --rm distcc-ng-verify:ci cat /etc/group > "${RUNNER_TEMP}/verify-etc/group"
          printf 'ci-runner:x:%s:%s:GitHub Actions runner uid:/tmp/distcc-ng-verify-home:/bin/bash\n' \
            "$(id -u)" "$(id -g)" >> "${RUNNER_TEMP}/verify-etc/passwd"
          printf 'ci-runner:x:%s:\n' "$(id -g)" >> "${RUNNER_TEMP}/verify-etc/group"

      - name: Real distcc-ng build+test inside the image
        # Logic lives in docker/verify/ci.sh's step_build_test() (Issue #286, Issue #285, PR #528).
        run: bash docker/verify/ci.sh build-test

      - name: ccache + Redis remote-storage self-test
        # Logic lives in docker/verify/ci.sh's step_ccache_redis() (Issue #285); uses the job's ephemeral `services:` Redis container above, never the maintainer's real secret.
        run: bash docker/verify/ci.sh ccache-redis

      - name: Real Samba configure dry-run (proves the sizing claim empirically)
        # Logic lives in docker/verify/ci.sh's step_samba_configure_dryrun() (Issue #285, doc/verification-checklist.md Section 5).
        run: bash docker/verify/ci.sh samba-configure-dryrun

  # --- Publish, only after a successful build+selftest, never from a PR -----
  # A pull_request event could carry an attacker-modified Dockerfile; gating
  # on !pull_request means only a push to current_dev (already reviewed and
  # merged) or an explicit manual workflow_dispatch can ever reach GHCR.
  publish:
    needs: build_and_selftest
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: $/.github/actions/ghcr-login
        with:
          token: ${{ github.token }}

      - name: Build and push distcc-ng-buildtools:latest
        # Rebuilt here rather than re-tagging build_and_selftest's image --
        # jobs run on separate runners with no shared Docker daemon/image
        # cache, so this is the only way to get the already-proven Dockerfile
        # into GHCR. Tagged both :latest (moving, what doc/docker.md tells
        # users to pull) and the short commit SHA (so a given pull can
        # be pinned to the exact revision that was proven by this run).
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/distcc-ng-buildtools
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          docker build \
            --file docker/verify/Dockerfile \
            --build-arg "VCS_REF=$(git rev-parse HEAD)" \
            --build-arg "VERSION=${SHORT_SHA}" \
            --tag "${IMAGE_BASE}:latest" \
            --tag "${IMAGE_BASE}:${SHORT_SHA}" \
            .
          docker push "${IMAGE_BASE}:latest"
          docker push "${IMAGE_BASE}:${SHORT_SHA}"
