# distcc-ng (https://github.com/wiki-mod/distcc-ng)
# SPDX-License-Identifier: GPL-2.0-or-later
# What: GHCR cleanup, SOT pin refresh, ccache heartbeat.
# Why: One owner for housekeeping; logic lives in ci.sh.
# From: Issue #479
name: Housekeeping

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which housekeeping task to run"
        type: choice
        options:
          - gc
          - heartbeat
          - sot-update
        default: gc
      package:
        description: "Which GHCR package to prune (gc task)"
        type: choice
        options:
          - all
          - distcc-ng
          - distcc-ng-pump
          - distcc-ng-nightly
          - distcc-ng-buildtools
          - distcc-ng-e2e
        default: all
      dry_run:
        description: "List what would be deleted without deleting anything"
        type: boolean
        default: true
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: housekeeping-${{ github.event.inputs.task || github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  gc:
    name: GHCR package cleanup
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'gc'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
          PACKAGE: ${{ inputs.package }}
        run: bash .github/scripts/ci.sh gc "$PACKAGE"

  sot_update:
    name: Refresh SOT pins (images, tools)
    if: (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1') || inputs.task == 'sot-update'
    runs-on: ubuntu-latest
    # What: Push the update branch, open its PR, dispatch CI.
    # Why: GITHUB_TOKEN PR events start no runs; dispatch does.
    # From: Issue #479, PR #544
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # What: A schedule refreshes current_dev; a dispatch its ref.
      # Why: Schedules fire on master, whose SOT is not the target.
      # From: Issue #479, PR #544
      - env:
          REF: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref_name }}
        run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout 1 "$REF"
      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/ci.sh sot-update

  heartbeat:
    name: Weekly distributed ccache heartbeat
    if: (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1') || inputs.task == 'heartbeat'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - run: bash .github/scripts/ci.sh e2e heartbeat

  control:
    name: Control build (plain compiler, diagnostic only)
    if: (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1') || inputs.task == 'heartbeat'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # What: Plain-compiler control build, non-gating.
    # Why: keeps a control failure from failing the run.
    # From: Issue #263, Issue #479
    continue-on-error: true
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - run: bash .github/scripts/ci.sh e2e control

  report:
    name: Report heartbeat status
    needs: [heartbeat]
    if: always() && needs.heartbeat.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/.github/scripts/ci.sh" | bash -s -- checkout
      - env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.heartbeat.result == 'success' && 'success' || 'failure' }}
          SCOPE: weekly ccache heartbeat
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/ci.sh report
