name: E2E test image build+publish

# Builds test/e2e/Dockerfile (the two-container distributed-compile test
# image shared by c-build.yml's per-push e2e job and master-heartbeat.yml's
# weekly ccache heartbeat) and proves it real via the image's own embedded
# self-test RUN step (a real distcc-through-distccd compile, not just an
# existence/--version check -- see the Dockerfile). Same shape as
# verify-image-build.yml for docker/verify/Dockerfile, kept as its own file
# rather than folded into that one (different image, different consumers,
# different schedule) per AGENTS.md rule 61's own precedent of picking a fit
# by actual trigger/purpose shape, not just topical similarity.
#
# Maintainer decision, 2026-07-28: this image should not be built fresh on
# every test run (the current approach, `docker compose build` inside
# run-e2e.sh) -- instead it's pre-built here, validated by its own
# self-test, and published, so a later change can switch the actual test
# workflows to pull a known-good image instead of reassembling it live each
# time. That consumer switch is deliberately out of scope here (see
# test/e2e/README.md's "not yet done" section for why, and a real design
# constraint it surfaced) -- this workflow only builds and publishes the
# image itself; nothing pulls it yet.
#
# It is also deliberately NOT pinned to a fixed base-image digest (see
# test/e2e/Dockerfile's own comment): the schedule trigger below rebuilds it
# once a day so it always picks up the latest Debian trixie-slim
# security/backport updates, acting as an early-warning canary for an
# upstream package update breaking this project's build -- a fixed digest
# would defeat that purpose. 02:00 UTC is deliberately chosen to not overlap
# with this repo's other daily/weekly schedules (c-build.yml 03:00,
# nightly-publish.yml 04:00, codeql.yml Sun 05:00, master-heartbeat.yml Mon
# 05:00, scorecard.yml Sun 06:00, openssf-baseline-recheck.yml 1st/15th
# 06:00, osv-scanner.yml Sun 07:00).
#
# Same structural limitation as nightly-publish.yml/master-heartbeat.yml
# (see issue #81's history): GitHub only honors `schedule` from the
# workflow file copy on the default branch (master). This file lands via
# current_dev, so the daily rebuild has no effect until the next
# current_dev->master promotion -- push/pull_request/workflow_dispatch are
# all exercisable now, the schedule is not.
#
# On a pull_request, only build_and_selftest runs (proves the Dockerfile
# still builds and self-tests clean) -- publish is skipped so a PR can never
# push a package, same guard as verify-image-build.yml. On push to
# current_dev, workflow_dispatch, or the daily schedule (once live on
# master), publish also runs, rebuilding the now-proven image and pushing
# it to GHCR as distcc-ng-e2e:latest (own package, separate from
# distcc-ng/distcc-ng-nightly/distcc-ng-buildtools).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - current_dev
    paths:
      - 'test/e2e/Dockerfile'
      - '.github/workflows/e2e-image-build.yml'
  pull_request:
    paths:
      - 'test/e2e/Dockerfile'
      - '.github/workflows/e2e-image-build.yml'
  schedule:
    # Daily, so the image always carries current trixie-slim updates -- see
    # the header comment above for why this one image is deliberately not
    # pinned to a fixed digest, and why 02:00 UTC specifically.
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  # The Dockerfile's own embedded self-test RUN step (a real distcc ->
  # distccd compile, checked against the daemon's own COMPILE_OK log line)
  # already fails this build on any regression -- see the Dockerfile.
  build_and_selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Whether this run is even eligible to publish -- a pull_request never
    # is, and a workflow_dispatch off a branch other than current_dev isn't
    # either (see the publish job's own condition below, which this mirrors
    # exactly so both jobs agree on eligibility). Computed once here and
    # exposed as a job output so the artifact-upload steps below and the
    # publish/report jobs don't each re-derive it and risk drifting apart.
    outputs:
      built_sha: ${{ steps.resolve.outputs.sha }}
      build_date: ${{ steps.resolve.outputs.date }}
      publish_eligible: ${{ steps.resolve.outputs.publish_eligible }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # schedule always evaluates from the default branch (master); this
          # image tracks current_dev's own test/e2e/Dockerfile, same
          # redirect pattern as c-build.yml/nightly-publish.yml's own
          # schedule-triggered jobs.
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
          # This checkout becomes a Docker build context, and
          # test/e2e/Dockerfile is single-stage: its `COPY . /work` lands the
          # whole working tree -- .git included, since this repository has no
          # .dockerignore -- directly in the image layer that is then saved,
          # uploaded as a workflow artifact, and pushed to GHCR. Left at its
          # default (true), actions/checkout writes an authenticated
          # extraheader into .git/config, so that credential would be baked
          # into a publicly-pullable layer and a publicly-downloadable
          # artifact; the action's own post-job credential cleanup only
          # rewrites the runner's checkout, never an image layer already
          # built from it. Nothing in this job needs the credential (the
          # build is entirely local, and publish authenticates to GHCR
          # separately via docker login), so the safe default here is to
          # never persist it in the first place rather than to exclude .git
          # from the context afterwards -- a repo-root .dockerignore would
          # silently change the build context of every other Dockerfile here
          # too (docker/release, docker/verify, test/e2e-full,
          # .clusterfuzzlite).
          persist-credentials: false

      # Resolved once, right after the checkout that will actually be built
      # below, and threaded through as a job output rather than
      # re-resolved independently in publish: publish's own checkout ran a
      # second, later `git rev-parse` against the same moving branch, which
      # could observe a newer current_dev commit than the one this job
      # actually built and self-tested if a push landed in between the two
      # jobs' checkouts -- publishing a tag that claims to pin a revision
      # this run never built.
      - name: Resolve build identity
        id: resolve
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] && \
             { [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/current_dev" ]; }; then
            echo "publish_eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build test/e2e/Dockerfile
        run: docker build -f test/e2e/Dockerfile -t distcc-ng-e2e:selftest .

      # Saved and handed to publish as an artifact rather than rebuilt there:
      # the base image is deliberately unpinned (see the Dockerfile's own
      # comment), so a second independent `docker build` in publish -- on a
      # different runner, possibly minutes later -- is not guaranteed to
      # produce byte-identical content to the image that actually passed
      # the self-test above (an upstream apt mirror update landing in
      # between could resolve different package versions). Saving the
      # exact image that was proven and loading it in publish closes that
      # gap. Guarded on publish-eligibility: a pull_request (or an
      # off-current_dev dispatch) never reaches publish, so saving and
      # uploading the full image there would just burn transfer time and
      # artifact-storage quota on a check-run that only needs the self-test
      # to pass, not the resulting image.
      - name: Save the proven image for publish
        if: steps.resolve.outputs.publish_eligible == 'true'
        run: docker save distcc-ng-e2e:selftest -o /tmp/distcc-ng-e2e.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.resolve.outputs.publish_eligible == 'true'
        with:
          # Scoped by run_attempt, not just the run: v4 artifacts can be
          # resolved across earlier attempts of the same workflow run unless
          # the name says otherwise, so on a rerun an unsuffixed name could
          # hand publish the *previous* attempt's tar while it tags those
          # bytes with this attempt's built_sha -- publishing an image that
          # was never the one this attempt self-tested, which is precisely
          # what saving-instead-of-rebuilding exists to prevent. Same
          # scoping package-release.yml already applies to its own per-run
          # digest artifacts, and it must stay in lockstep with the
          # download name in publish below.
          name: distcc-ng-e2e-image-${{ github.run_attempt }}
          path: /tmp/distcc-ng-e2e.tar
          retention-days: 1

  # --- Publish, only after a successful build+selftest, never from a PR -----
  # Same reasoning as verify-image-build.yml's publish job: a pull_request
  # event could carry an attacker-modified Dockerfile, so gating on
  # !pull_request means only a push to current_dev (already reviewed and
  # merged), an explicit manual workflow_dispatch, or the daily schedule can
  # ever reach GHCR. push is already scoped to current_dev via this file's
  # own `on:` block above; workflow_dispatch has no such branch restriction
  # from GitHub itself, so it's scoped explicitly here too -- otherwise
  # manually dispatching this workflow from an arbitrary branch (e.g. an old
  # feature branch carrying a stale copy of this file) would publish that
  # branch's Dockerfile to the moving :latest tag.
  publish:
    needs: build_and_selftest
    if: needs.build_and_selftest.outputs.publish_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # A fixed, unqualified group (not ref-scoped like the workflow-level
    # concurrency above): the workflow-level group is per-ref, so a
    # scheduled run (ref refs/heads/master, per GitHub's own schedule
    # semantics) and a current_dev push (ref refs/heads/current_dev) land in
    # different groups and can publish concurrently. If the scheduled run
    # happens to finish after a newer push's publish, it would overwrite
    # :latest with older content. Queuing (cancel-in-progress: false, same
    # as nightly-publish.yml's own publisher-wide group) instead of
    # cancelling means every eligible publish still actually runs, just
    # never two at once.
    concurrency:
      group: e2e-image-build-publish
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Log in to GHCR
        run: printf '%s\n' "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Must stay identical to the upload name in build_and_selftest,
          # run_attempt suffix included -- see that step's comment for why
          # an unsuffixed name can resolve a previous attempt's artifact.
          name: distcc-ng-e2e-image-${{ github.run_attempt }}
          path: /tmp

      - name: Load and push the already-proven image
        # Loaded from build_and_selftest's saved artifact rather than
        # rebuilt here -- see that job's own comment on why: the base
        # image is deliberately unpinned, so a second independent `docker
        # build` on a different runner is not guaranteed to reproduce the
        # exact content that passed the self-test. No checkout in this job
        # at all: SHA/date come from build_and_selftest's own outputs
        # (resolved right after *its* checkout, see that job's "Resolve
        # build identity" step) rather than a second, independent
        # `git rev-parse` here, which could observe a newer current_dev
        # commit than the one actually built if a push landed between the
        # two jobs' checkouts. Tagged :latest (moving, what the test
        # workflows will pull once a later change wires that up) and a
        # SHORT_SHA-DATE-RUN_ID tag: SHA-DATE alone still collides if the
        # same commit is rebuilt twice on the same UTC day (a manual
        # dispatch/rerun alongside the daily schedule) -- since the base
        # image and apt repositories are both deliberately mutable, two
        # same-day builds of the same SHA are not guaranteed to be
        # byte-identical. run_attempt is part of the tag alongside run_id
        # for the same reason, and is not redundant with it: rerunning a
        # workflow run keeps the same run_id and only increments
        # run_attempt, so run_id alone would let a rerun overwrite the
        # supposedly immutable tag of the attempt before it -- with
        # genuinely different content, given the mutable base image. Same
        # reasoning package-release.yml already applies to its own
        # per-run digest artifacts, which are likewise scoped by
        # run_attempt rather than run_id alone.
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/distcc-ng-e2e
          BUILT_SHA: ${{ needs.build_and_selftest.outputs.built_sha }}
          BUILD_DATE: ${{ needs.build_and_selftest.outputs.build_date }}
        run: |
          set -euo pipefail
          docker load -i /tmp/distcc-ng-e2e.tar
          BUILD_TAG="${BUILT_SHA}-${BUILD_DATE}-${{ github.run_id }}-${{ github.run_attempt }}"
          docker tag distcc-ng-e2e:selftest "${IMAGE_BASE}:${BUILD_TAG}"
          docker tag distcc-ng-e2e:selftest "${IMAGE_BASE}:latest"
          # Immutable tag first, moving tag second, deliberately in this
          # order: the two pushes are independent network operations and the
          # second can fail on its own. Moving :latest first would, on such a
          # failure, leave consumers with a freshly-promoted :latest whose
          # promised pinnable tag does not exist -- unpinnable content in the
          # moving channel, even though the run is correctly reported failed.
          # This order degrades the other way instead: the immutable tag
          # exists and is pullable, while :latest still points at the last
          # fully-successful publish.
          docker push "${IMAGE_BASE}:${BUILD_TAG}"
          docker push "${IMAGE_BASE}:latest"

  # Files/updates the standing nightly-broken issue on failure, closes it on
  # success -- but only for the runs this actually matters for (the daily
  # schedule, or a manual dispatch/current_dev push meant to really publish);
  # a PR's own build_and_selftest failure already surfaces as a normal failed
  # PR check, it doesn't need a standing tracking issue too. Gated on the
  # same publish_eligible output publish itself uses (rather than a
  # separately-written condition that could drift from it): a
  # workflow_dispatch off a branch other than current_dev deliberately
  # skips publish, and without this same guard here, that skip would surface
  # to the outcome expression below as neither success nor a real failure --
  # a legitimate no-op reported as a broken nightly run.
  report:
    needs: [build_and_selftest, publish]
    if: >-
      ${{ always() && !cancelled() && github.event_name != 'pull_request' &&
          needs.build_and_selftest.outputs.publish_eligible == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: current_dev
      - uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ (needs.build_and_selftest.result == 'success' && needs.publish.result == 'success') && 'success' || 'failure' }}
          scope: e2e test image build+publish (distcc-ng-e2e)
