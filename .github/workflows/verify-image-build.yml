name: Verification container build+test

# Builds docker/verify/Dockerfile (issue #264) and proves it real: the image
# build's own self-test RUN step already fails the build if a baked-in tool
# is missing or non-functional (see the Dockerfile), so a green build here is
# itself part of the evidence. This workflow adds the checks that can't run
# inside `docker build` (ptrace-dependent tools, a real distcc-ng
# ./autogen.sh && ./configure && make && make check run against this repo's
# own source, and a real Samba ./configure dry-run to prove the Samba-sized
# dependency inventory is actually sufficient) -- run here because this
# development machine has no local Docker (WSL2 is banned for cited
# verification evidence per this repo's standing rule), so CI is the real,
# honest verification environment for this change, matching AGENTS.md rule
# 32's preference for CI over an unverifiable local claim.
#
# On a pull_request, only build_and_selftest runs (proves the Dockerfile/image
# still work) -- publish is skipped for PRs so a PR can never push a package.
# On push to current_dev (or a manual workflow_dispatch), publish also runs,
# rebuilding the now-proven image and pushing it to GHCR as
# distcc-ng-buildtools:latest (own package, separate from distcc-ng/
# distcc-ng-nightly), so pulling and starting the image is the entire setup
# step (issue #264's own "pre-built, fully self-contained" requirement) rather
# than every user needing a local `docker build`.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - current_dev
    paths:
      - 'docker/verify/**'
      - '.github/workflows/verify-image-build.yml'
  pull_request:
    paths:
      - 'docker/verify/**'
      - '.github/workflows/verify-image-build.yml'

permissions:
  contents: read

jobs:
  build_and_selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Ephemeral, CI-local Redis for the ccache-remote-storage self-test step
    # below -- this is a throwaway container that only exists for this job
    # run, entirely unrelated to the maintainer's own real CCACHE_REMOTE_STORAGE
    # repo secret (a private LAN Redis instance GitHub-hosted runners cannot
    # reach anyway, and never referenced anywhere in this workflow). Proving
    # ccache's Redis remote-storage integration actually works is valuable on
    # its own merits: per the maintainer, a shared Redis-backed remote cache
    # is the single most common real-world ccache deployment shape.
    #
    # GitHub Actions' `services:` block has no dedicated memory-limit field
    # (verified against GitHub's own workflow-syntax and service-container
    # docs -- neither documents one). `options:` does forward arbitrary
    # `docker create` flags to the service container (documented for the
    # sibling `jobs.<job_id>.container.options` key, which explicitly points
    # at Docker's own `docker create` option list; `services.<id>.options`
    # is the same mechanism applied to a service container), so the
    # maintainer's ~2GB ask is expressed as a real `docker create` flag
    # (`--memory=2g`) here rather than skipped.
    #
    # `ports: ['6379:6379']` binds Redis to a fixed, known host port
    # (rather than the random-port form, which would require reading
    # `job.services.redis.ports.6379` back out at runtime) specifically so
    # the self-test step below has one real, verified address
    # (127.0.0.1:6379) to hand to CCACHE_REMOTE_STORAGE without guessing.
    services:
      redis:
        image: redis:alpine
        options: >-
          --memory=2g
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build docker/verify/Dockerfile
        # The image build's own embedded self-test RUN step (gcc/clang,
        # ASan, UBSan, valgrind, binutils, ripgrep/grep/less, ccache) already
        # fails this step on any tool regression -- see the Dockerfile.
        run: |
          docker build -f docker/verify/Dockerfile -t distcc-ng-verify:ci .

      - name: Ptrace-dependent tool self-test (gdb/strace/ltrace)
        run: |
          docker run --rm --cap-add=SYS_PTRACE \
            -v "${{ github.workspace }}/docker/verify:/verify:ro" \
            distcc-ng-verify:ci bash /verify/selftest-ptrace.sh

      - name: Real distcc-ng build+test inside the image
        # Proves the image is sufficient for this repo's own toolchain, not
        # just that gcc exists -- the full real validation bar (AGENTS.md's
        # Required Validation section).
        #
        # `--user "$(id -u):$(id -g)"` (issue #286): this used to run as
        # `--user root`, `chown -R verify:verify` the bind-mounted
        # workspace, then `su -s /bin/bash verify -c '...'` -- root was
        # needed transiently only to fix a bind-mount ownership mismatch
        # (actions/checkout leaves the workspace owned by the runner's own
        # uid, e.g. 1001, which differs from the image's baked-in `verify`
        # uid, 1000). The maintainer flagged during PR #283 review that
        # reaching for root at all, even transiently, for a narrow `chown`,
        # shouldn't become an unquestioned standing convention without
        # checking whether it's actually necessary (issue #286). It is not:
        # `--user $(id -u):$(id -g)` makes the container process itself run
        # as the runner's own uid, so it already owns the bind-mounted
        # workspace with no `chown`/`su`/root involved at any point --
        # confirmed empirically (issue #286's own investigation, PR #405):
        # a real CI run comparing the old root+chown+su pattern against
        # this one produced byte-identical `test/testdistcc.py`/comfychair
        # results (138 OK, 16 NOTRUN, 0 FAIL, including root-only cases
        # like `Unicode_Case` and `AutogroupNicenessPrivilegeDrop_Case`
        # correctly NOTRUN-skipping under this non-root uid exactly as they
        # did under the old su'd-to-`verify` non-root uid). `distccd` is
        # thus never started as real root at all under this pattern either
        # -- the same property root+chown+su was carefully arranged to
        # preserve, just without ever touching root to get there.
        #
        # `-e HOME=/tmp/distcc-ng-verify-home` + `mkdir -p "$HOME"`: a real,
        # confirmed-empirically-necessary companion fix, not a
        # belt-and-suspenders guess. Docker does not synthesize an
        # `/etc/passwd` entry for a numeric `--user` uid with no matching
        # name in the image (`whoami` inside the container reports "cannot
        # find name for user ID <uid>") -- and without an explicit `-e
        # HOME=`, such a uid gets `$HOME=/`, which it cannot write to.
        # Nothing in this repo's own `./autogen.sh`/`./configure`/`make`/
        # `make check` chain needs `$HOME` to already exist as a real
        # user's home directory, only a writable path to point it at.
        #
        # A third, separate real failure was found and fixed earlier
        # getting this step right (retained from before issue #286, still
        # applicable): test/testdistcc.py's Gdb_Case asserted gdb produced
        # no stderr, but got "warning: Error disabling address space
        # randomization: Operation not permitted" -- gdb's own default
        # behavior is to disable ASLR for the debuggee via personality(2)
        # before running it. Adding --cap-add=SYS_PTRACE alone did NOT fix
        # this (confirmed empirically: the identical warning reappeared
        # verbatim in the next CI run) -- capabilities and seccomp are two
        # independent Docker security layers, and Docker's *default
        # seccomp profile* denies personality()'s ADDR_NO_RANDOMIZE flag
        # outright, regardless of which capabilities the container holds.
        # --security-opt seccomp=unconfined is scoped to this one CI
        # verification step (an isolated, ephemeral GitHub-hosted runner,
        # not the shipped runtime image or a multi-tenant host), which is
        # an acceptable trade-off for a container whose whole purpose is
        # real debugging with gdb/strace/ltrace -- a real developer using
        # this image locally for the same `make check` would need the same
        # flag for the same reason.
        # --init runs a real init (tini) as this container's PID 1 -- `make
        # check` daemonizes and kills many short-lived distccd instances
        # (dcc_detach()'s standard fork()+_exit(0)+setsid() pattern
        # reparents each one to PID 1), and testdistcc.py's own teardown
        # polls os.kill(pid, 0) waiting for each to actually disappear
        # rather than wait()ing it (it can't -- the daemon detached).
        # Without a real init to reap those reparented zombies, that poll
        # spins forever: a real, silent hang in this exact recurring CI
        # job, not just an ad-hoc local run. See doc/verification-
        # checklist.md Section 9's matching entry.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --init --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v "${{ github.workspace }}:/work/src:rw" \
            -w /work/src \
            -e HOME=/tmp/distcc-ng-verify-home \
            distcc-ng-verify:ci bash -c '
              set -euo pipefail
              mkdir -p "$HOME"
              id
              ./autogen.sh
              ./configure PYTHON=python3
              make
              make check
            '

      - name: ccache + Redis remote-storage self-test
        # Proves the single most common real-world ccache deployment shape
        # (a shared Redis-backed remote/secondary cache, per the maintainer)
        # actually round-trips a real cache hit through Redis -- not just
        # that `ccache`/`redis-cli` exit 0. Uses the ephemeral `services:`
        # Redis container declared on this job above; never references the
        # maintainer's own real CCACHE_REMOTE_STORAGE secret (a private LAN
        # instance, unreachable from and irrelevant to this runner).
        #
        # `--network host` (Linux runner only, matching the other docker run
        # steps in this job) lets the container reach the `services:` Redis
        # container on the runner's own loopback interface, at the fixed
        # 127.0.0.1:6379 port bound above.
        #
        # CCACHE_REMOTE_STORAGE is ccache's current name for this setting;
        # CCACHE_SECONDARY_STORAGE is the exact same setting under ccache's
        # own prior (still-honored) name, not a second/independent option
        # (ccache's own manual: "In previous ccache versions this option was
        # called secondary_storage (CCACHE_SECONDARY_STORAGE), which can
        # still be used as an alias."). CCACHE_REMOTE_STORAGE is used here
        # since it is the current, non-deprecated name.
        #
        # Compiles a single real distcc-ng source file (src/dopt.o) using
        # this repo's own actual Makefile suffix rule (`.c.o:`, see the
        # top-level Makefile) rather than a hand-built gcc command line --
        # that rule already carries this build's real, configure-computed
        # CPPFLAGS/CFLAGS (include paths, -DHAVE_CONFIG_H, etc.), so it
        # exercises the same compile a real `make` would do, with `ccache`
        # substituted in for the compiler via `make CC="ccache gcc"`
        # (GNU Make's own semantics: a command-line variable assignment
        # always overrides the makefile's own `CC = @CC@` line). `touch`ing
        # the source file first forces a rebuild each time, since the
        # object file already exists (built without ccache) from the
        # previous "Real distcc-ng build+test" step above.
        #
        # Two separate, fresh `docker run` invocations (not one container
        # compiling twice) is the point, not an accident: a single
        # container's own *local* on-disk ccache dir would itself explain a
        # second-compile hit, proving nothing about Redis specifically.
        # Each invocation here gets a brand-new, empty container filesystem
        # (no local ccache dir carried over), so the only way the second
        # invocation's compile can hit is if it actually fetched the object
        # back out of the first invocation's Redis push -- that is the
        # real, specific claim this step exists to verify. Repeats the same
        # `--user $(id -u):$(id -g)` + `-e HOME=...` pattern the earlier
        # build+test step above uses (issue #286 -- no root/chown/su
        # anywhere in this workflow anymore), rather than assuming the
        # workspace is still owned by any particular uid from before.
        #
        # `-e HOME=/tmp/ccache-home` (+ `mkdir -p "$HOME"` inside the
        # container, same as the earlier build+test step) matters for a
        # second, real reason here beyond the earlier step's autoconf/make
        # needs: ccache's own *local* cache dir (its remote-storage
        # push/pull still goes through a local cache layer first) defaults
        # to a path under `$HOME` -- an unset or unwritable `$HOME` (see
        # the build+test step's comment above: Docker leaves `$HOME=/` for
        # a numeric `--user` with no matching `/etc/passwd` entry) breaks
        # the local half of ccache's own caching before Redis is ever
        # involved -- confirmed for real: an earlier version of this step
        # pointed `$HOME` at a *host* path under `$RUNNER_TEMP` without
        # bind-mounting it into the container, which doesn't exist inside
        # the container's own filesystem at all and failed with a real
        # `ccache: error: Permission denied`. `/tmp/ccache-home` is a
        # plain container-internal path instead, created fresh inside each
        # invocation's own brand-new container filesystem -- no bind mount,
        # no host-side directory, and (the actual point of using two
        # separate `docker run` calls at all) never carried over between
        # the first and second invocation, so the second compile's hit can
        # only have come from Redis, not a leftover local cache dir.
        run: |
          set -euo pipefail

          run_ccache_build () {
            local label="$1"
            local stats_file="$2"
            docker run --rm --network host --user "$(id -u):$(id -g)" \
              -v "${{ github.workspace }}:/work/src:rw" \
              -w /work/src \
              -e CCACHE_REMOTE_STORAGE="redis://127.0.0.1:6379" \
              -e HOME=/tmp/ccache-home \
              distcc-ng-verify:ci bash -c '
                set -euo pipefail
                mkdir -p "$HOME"
                cd /work/src
                ccache --zero-stats >/dev/null
                touch src/dopt.c
                make CC="ccache gcc" src/dopt.o
                ccache --show-stats
              ' | tee "${stats_file}"
            echo "--- ${label}: ccache stats above ---"
          }

          run_ccache_build "First container (expect a MISS, pushes the object to Redis)" "${RUNNER_TEMP}/first-run-stats.log"
          run_ccache_build "Second container (fresh filesystem, no local ccache dir -- a Hit here can only have come from Redis)" "${RUNNER_TEMP}/second-run-stats.log"

          if ! grep -qE "Hits:[[:space:]]*[1-9]" "${RUNNER_TEMP}/second-run-stats.log"; then
            echo "::error::ccache reported no cache hit on the second, fresh container -- Redis remote storage did not actually serve the cached object"
            exit 1
          fi
          echo "Real cache hit confirmed against the ephemeral Redis remote-storage backend."

      - name: Real Samba configure dry-run (proves the sizing claim empirically)
        # Downloads the real upstream Samba release tarball, its detached
        # signature, and Samba's own published public key (all three from
        # samba.org, per the exact verification method documented on
        # https://www.samba.org/samba/download/ -- gpg --import the key,
        # then gpg --verify the signature against the *uncompressed* tarball,
        # matching that page's own instructions). This is verification-
        # checklist section 5's requirement (verify a downloaded artifact
        # against the upstream project's own published value, not just "it
        # downloaded without error") before using it as the empirical proof
        # that this image's Samba-sized package inventory is actually
        # sufficient: Samba's own real ./configure (its bundled waf wrapper)
        # must exit zero.
        #
        # Detecting failure via the real exit code, not a text grep: an
        # earlier version of this step grepped configure.log for "not
        # found" and reported a false failure -- Samba's waf-based configure
        # legitimately prints many benign "Checking for X: not found" lines
        # for *optional* features it simply disables (e.g. libsystemd-
        # journal, lttng-ust), which is not a real error, and the log even
        # said "'configure' finished successfully" right before the grep-
        # based check wrongly failed the step. waf's own exit code is the
        # real, robust signal for "did configure actually succeed" -- `set
        # -o pipefail` (part of `set -euo pipefail` below) makes the `if`
        # condition below see `./configure`'s real exit status through the
        # `tee` pipe, not tee's.
        run: |
          docker run --rm distcc-ng-verify:ci bash -c '
            set -euo pipefail
            cd /tmp
            wget -q https://download.samba.org/pub/samba/stable/samba-4.22.4.tar.gz
            wget -q https://download.samba.org/pub/samba/stable/samba-4.22.4.tar.asc
            wget -q https://download.samba.org/pub/samba/samba-pubkey.asc
            gpg --batch --import samba-pubkey.asc
            gunzip -k samba-4.22.4.tar.gz
            gpg --batch --verify samba-4.22.4.tar.asc samba-4.22.4.tar 2>&1 | tee gpg-verify.log
            grep -q "Good signature from" gpg-verify.log \
              || { echo "::error::Samba tarball signature did not verify against samba.org own published key -- refusing to use it as verification evidence"; exit 1; }
            tar xf samba-4.22.4.tar
            cd samba-4.22.4
            if ./configure 2>&1 | tee configure.log; then
              echo "Samba ./configure exited 0 -- this images package inventory is sufficient."
            else
              echo "::error::Samba ./configure exited non-zero -- this images package inventory is not actually sufficient"
              exit 1
            fi
          '

  # --- Publish, only after a successful build+selftest, never from a PR -----
  # A pull_request event could carry an attacker-modified Dockerfile; gating
  # on !pull_request means only a push to current_dev (already reviewed and
  # merged) or an explicit manual workflow_dispatch can ever reach GHCR.
  publish:
    needs: build_and_selftest
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: printf '%s\n' "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push distcc-ng-buildtools:latest
        # Rebuilt here rather than re-tagging build_and_selftest's image --
        # jobs run on separate runners with no shared Docker daemon/image
        # cache, so this is the only way to get the already-proven Dockerfile
        # into GHCR. Tagged both :latest (moving, what doc/docker.md tells
        # users to pull) and the short commit SHA (so a given pull can
        # be pinned to the exact revision that was proven by this run).
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/distcc-ng-buildtools
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          docker build \
            --file docker/verify/Dockerfile \
            --build-arg "VCS_REF=$(git rev-parse HEAD)" \
            --build-arg "VERSION=${SHORT_SHA}" \
            --tag "${IMAGE_BASE}:latest" \
            --tag "${IMAGE_BASE}:${SHORT_SHA}" \
            .
          docker push "${IMAGE_BASE}:latest"
          docker push "${IMAGE_BASE}:${SHORT_SHA}"
