name: E2E test image build+publish

# What: Builds test/e2e/Dockerfile (the two-container distributed-compile
# test image shared by c-build.yml/master-heartbeat.yml), proves it via the
# image's own embedded self-test, and (outside pull_request) publishes it
# to GHCR as distcc-ng-e2e:latest. Kept as its own file rather than folded
# into verify-image-build.yml per AGENTS.md rule 61 (different image,
# consumers, and schedule). Deliberately not pinned to a fixed base-image
# digest, so the daily schedule rebuild picks up current trixie-slim
# updates as an early-warning canary.
# Why: Pre-building and publishing (maintainer decision, 2026-07-28) lets a
# later change switch test workflows to pull a known-good image instead of
# reassembling it live each run; that consumer switch itself is out of
# scope here (see test/e2e/README.md). schedule has no live effect until
# the next current_dev->master promotion (see issue #81's history).
# From: Issue #81

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - current_dev
    paths:
      - 'test/e2e/Dockerfile'
      - '.github/workflows/e2e-image-build.yml'
  # What: ready_for_review is listed explicitly.
  # Why: See c-build.yml's pull_request block for the full rationale.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'test/e2e/Dockerfile'
      - '.github/workflows/e2e-image-build.yml'
  schedule:
    # What: Daily rebuild so the image always carries current trixie-slim
    # updates.
    # Why: 02:00 UTC avoids this repo's other daily/weekly schedules; see
    # the header comment above for why the base image is unpinned.
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  # What: Relies on test/e2e/Dockerfile's own embedded self-test RUN step
  # (a real distcc -> distccd compile checked against the daemon's
  # COMPILE_OK log line) to fail this build on any regression.
  # Why: The self-test runs inside the `docker build` itself, not as a
  # separate step here, so a regression fails this job the same way any
  # other RUN step failure would -- there is deliberately no extra
  # verification step below duplicating what the image already proves.
  # From: PR #354
  build_and_selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # What: Whether this run is even eligible to publish (a pull_request
    # never is; neither is a workflow_dispatch off a branch other than
    # current_dev), computed once and exposed as a job output.
    # Why: Mirrors the publish job's own condition below exactly so both
    # jobs agree, and lets downstream steps consume it instead of each
    # re-deriving it and risking drift.
    outputs:
      built_sha: ${{ steps.resolve.outputs.sha }}
      built_full_sha: ${{ steps.resolve.outputs.full_sha }}
      build_date: ${{ steps.resolve.outputs.date }}
      publish_eligible: ${{ steps.resolve.outputs.publish_eligible }}
      # What: The artifact name is a job output, not recomputed by publish.
      # Why: "Re-run failed jobs" can start a new attempt without
      # re-running an already-succeeded prerequisite, so publish's own
      # github.run_attempt could outrun the attempt that actually produced
      # the retained artifact; consuming the producing job's output avoids
      # requesting a name nothing exists under.
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # What: Redirects a schedule-triggered run to current_dev.
          # Why: schedule always evaluates from the default branch
          # (master), but this image tracks current_dev's own Dockerfile;
          # same pattern as c-build.yml/nightly-publish.yml.
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
          # What: Does not persist the checkout credential.
          # Why: test/e2e/Dockerfile's `COPY . /work` bakes this whole
          # checkout -- .git included, no .dockerignore exists -- into an
          # image layer that gets saved, uploaded, and pushed to GHCR;
          # actions/checkout's default would write an authenticated
          # extraheader into .git/config that would leak into that
          # publicly-pullable layer. Nothing here needs the credential.
          persist-credentials: false

      # What: Resolved once, right after the checkout that gets built, and
      # threaded through as a job output rather than re-resolved in publish.
      # Why: publish's own, later `git rev-parse` against the same moving
      # branch could observe a newer current_dev commit if a push landed
      # in between the two jobs' checkouts, tagging a revision this run
      # never actually built.
      - name: Resolve build identity
        id: resolve
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ] && \
             { [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/current_dev" ]; }; then
            publish_eligible=true
          else
            publish_eligible=false
          fi
          # What: One grouped redirect into $GITHUB_OUTPUT rather than an
          # echo-per-line, matching package-release.yml's own setup job.
          # Why: shellcheck's SC2129 flags the repeated-redirect form.
          {
            printf 'sha=%s\n' "$(git rev-parse --short HEAD)"
            printf 'full_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'date=%s\n' "$(date -u +%Y%m%d)"
            printf 'artifact_name=distcc-ng-e2e-image-%s\n' "${RUN_ATTEMPT}"
            printf 'publish_eligible=%s\n' "${publish_eligible}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build test/e2e/Dockerfile
        run: docker build -f test/e2e/Dockerfile -t distcc-ng-e2e:selftest .

      # What: Saved and handed to publish as an artifact rather than
      # rebuilt there, guarded on publish-eligibility.
      # Why: The base image is deliberately unpinned, so a second,
      # independent `docker build` in publish is not guaranteed to
      # reproduce the exact bytes that passed the self-test above; a
      # non-eligible run (pull_request, off-current_dev dispatch) skips
      # this to avoid burning transfer time and storage quota for nothing.
      - name: Save the proven image for publish
        if: steps.resolve.outputs.publish_eligible == 'true'
        run: docker save distcc-ng-e2e:selftest -o /tmp/distcc-ng-e2e.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.resolve.outputs.publish_eligible == 'true'
        with:
          # What: Scoped by run_attempt (via the resolve step's own
          # output, not recomputed here), same scoping package-release.yml
          # applies to its own per-run digest artifacts.
          # Why: v4 artifacts resolve across earlier attempts unless the
          # name says otherwise, so an unsuffixed name on a rerun could
          # hand publish the previous attempt's tar tagged with this
          # attempt's built_sha, publishing an image never actually
          # self-tested this run.
          name: ${{ steps.resolve.outputs.artifact_name }}
          path: /tmp/distcc-ng-e2e.tar
          retention-days: 1

  # --- Publish, only after a successful build+selftest, never from a PR -----
  # What: Gates on !pull_request (same reasoning as verify-image-build.yml)
  # and explicitly restricts workflow_dispatch to current_dev, on top of
  # this file's own `on: push` branch restriction.
  # Why: A pull_request could carry an attacker-modified Dockerfile;
  # without the explicit branch check, a manual dispatch from an old
  # feature branch's stale copy of this file could publish that branch's
  # Dockerfile to the moving :latest tag.
  publish:
    needs: build_and_selftest
    if: needs.build_and_selftest.outputs.publish_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # What: A fixed, unqualified group, not ref-scoped like the
    # workflow-level concurrency above; queues (cancel-in-progress: false,
    # same as nightly-publish.yml's own group) rather than cancelling.
    # Why: The workflow-level group is per-ref, so a scheduled run
    # (master) and a current_dev push land in different groups and could
    # otherwise publish concurrently, letting a late-finishing scheduled
    # run overwrite :latest with older content.
    concurrency:
      group: e2e-image-build-publish
      cancel-in-progress: false
    steps:
      - uses: $/.github/actions/harden-runner

      # What: Full history (fetch-depth: 0), no persisted credential.
      # Why: Needed only for the ancestry check in the final "Move
      # :latest" step (git merge-base --is-ancestor), not for the Docker
      # build itself, which loads build_and_selftest's artifact instead of
      # rebuilding; full history keeps both the published and built
      # commits reachable regardless of how far apart they are.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: current_dev
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/ghcr-login
        with:
          token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # What: Deliberately the producing job's own output, not
          # github.run_attempt re-evaluated here.
          # Why: "Re-run failed jobs" can skip re-running an
          # already-succeeded build_and_selftest, leaving this job's own
          # attempt number ahead of the one that uploaded the tar;
          # recomputing it here would request a name nothing produced.
          name: ${{ needs.build_and_selftest.outputs.artifact_name }}
          path: /tmp

      - name: Load and push the already-proven image
        # What: Loads build_and_selftest's saved artifact (no checkout
        # here); SHA/date come from that job's own outputs, not a second
        # `git rev-parse`; tagged SHORT_SHA-DATE-RUN_ID-RUN_ATTEMPT.
        # Why: A second, independent `docker build` here isn't guaranteed
        # byte-identical to what passed the self-test; SHA-DATE alone
        # still collides on a same-day rebuild of the same commit, and
        # run_attempt (not just run_id, same scoping as
        # package-release.yml) stops a rerun from overwriting an earlier
        # attempt's differently-built, supposedly immutable tag.
        # From: PR #476
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/distcc-ng-e2e
          BUILT_SHA: ${{ needs.build_and_selftest.outputs.built_sha }}
          BUILD_DATE: ${{ needs.build_and_selftest.outputs.build_date }}
        run: |
          set -euo pipefail
          docker load -i /tmp/distcc-ng-e2e.tar
          BUILD_TAG="${BUILT_SHA}-${BUILD_DATE}-${{ github.run_id }}-${{ github.run_attempt }}"
          docker tag distcc-ng-e2e:selftest "${IMAGE_BASE}:${BUILD_TAG}"
          # What: Pushes the immutable tag unconditionally.
          # Why: It is tied to exactly what this run built and
          # self-tested, so it is always correct to publish regardless of
          # current_dev's tip by now.
          docker push "${IMAGE_BASE}:${BUILD_TAG}"

      # What: Guards the :latest move separately from the immutable-tag
      # push above, comparing the BUILT REVISION via real commit ancestry
      # on current_dev first, and falling back to (run_id, run_attempt)
      # only to break a tie between two builds of the identical commit.
      # Why: The job-level concurrency group doesn't order two
      # independently-triggered runs against each other, so an
      # older-commit run could still execute this step last; commit
      # ancestry is the correct signal because run_id/run_attempt alone
      # reflect creation order, not build recency, and two builds of the
      # same commit are not guaranteed to be byte-identical given the
      # deliberately mutable base image and apt sources.
      # From: PR #476
      - name: Move :latest only if this build is not older than what is published
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/distcc-ng-e2e
          BUILT_FULL_SHA: ${{ needs.build_and_selftest.outputs.built_full_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail

          # What: Finds the version currently tagged :latest (if any) and
          # reads its sibling immutable tag's (sha, run_id, run_attempt)
          # from its four dash-separated fields.
          # Why: Only a positively-identified absent package (a real HTTP
          # 404) is treated as "nothing published yet"; any other lookup
          # failure fails the step outright instead of silently letting a
          # stale queued run win the comparison while reporting success.
          PUBLISHED_SHA=""
          PUBLISHED_RUN_ID=0
          PUBLISHED_RUN_ATTEMPT=0
          API_OUTPUT="$(gh api "orgs/${{ github.repository_owner }}/packages/container/distcc-ng-e2e/versions" \
            --paginate \
            --jq '.[] | select(.metadata.container.tags != null) | select(.metadata.container.tags | index("latest")) | .metadata.container.tags[]' \
            2>&1)"
          API_STATUS=$?
          if [ "${API_STATUS}" -ne 0 ]; then
            if printf '%s' "${API_OUTPUT}" | grep -qi 'HTTP 404'; then
              TAGS=""
            else
              echo "::error::Could not query GHCR package versions for distcc-ng-e2e (not a 404 -- treating as a real failure rather than defaulting to 'no prior publish'): ${API_OUTPUT}"
              exit 1
            fi
          else
            TAGS="${API_OUTPUT}"
          fi
          set -e

          # What: Computes the MAXIMUM (run_id, run_attempt) across every
          # matching sibling tag, carrying along its paired SHA.
          # Why: Multiple immutable tags can carry "latest" if identical
          # content was pushed under more than one per-run tag; trusting
          # API return order instead of the actual maximum could compare
          # against a stale sibling and move :latest backward.
          while IFS= read -r t; do
            [ -n "${t}" ] || continue
            FIELDS="$(printf '%s' "${t}" | awk -F- 'NF==4 && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/ {print $1, $3, $4}')"
            [ -n "${FIELDS}" ] || continue
            CAND_SHA="$(printf '%s' "${FIELDS}" | cut -d' ' -f1)"
            CAND_RUN_ID="$(printf '%s' "${FIELDS}" | cut -d' ' -f2)"
            CAND_RUN_ATTEMPT="$(printf '%s' "${FIELDS}" | cut -d' ' -f3)"
            if [ "${CAND_RUN_ID}" -gt "${PUBLISHED_RUN_ID}" ] || \
               { [ "${CAND_RUN_ID}" -eq "${PUBLISHED_RUN_ID}" ] && [ "${CAND_RUN_ATTEMPT}" -gt "${PUBLISHED_RUN_ATTEMPT}" ]; }; then
              PUBLISHED_SHA="${CAND_SHA}"
              PUBLISHED_RUN_ID="${CAND_RUN_ID}"
              PUBLISHED_RUN_ATTEMPT="${CAND_RUN_ATTEMPT}"
            fi
          done <<< "${TAGS}"

          SHOULD_MOVE=false
          if [ -z "${PUBLISHED_SHA}" ]; then
            SHOULD_MOVE=true
          else
            # What: Resolves the published tag's SHA as its own statement,
            # outside any if/elif condition.
            # Why: `set -e` is exempt inside an if/elif/while/until test,
            # so a failing `git rev-parse` there (e.g. an ambiguous short
            # SHA) would silently read as "false" and leave :latest stale
            # while still reporting success.
            if ! PUBLISHED_FULL_SHA="$(git rev-parse "${PUBLISHED_SHA}")"; then
              echo "::error::Published tag's SHA (${PUBLISHED_SHA}) could not be resolved against current_dev's history fetched above -- refusing to treat an unresolvable published commit as \"not newer\" and silently leave :latest stale."
              exit 1
            fi

            if [ "${PUBLISHED_FULL_SHA}" = "${BUILT_FULL_SHA}" ]; then
              # What: Same commit as what's published; falls back to run
              # recency.
              # Why: The mutable base image means the two builds' bytes
              # might still differ.
              if [ "${CURRENT_RUN_ID}" -gt "${PUBLISHED_RUN_ID}" ] || \
                 { [ "${CURRENT_RUN_ID}" -eq "${PUBLISHED_RUN_ID}" ] && [ "${CURRENT_RUN_ATTEMPT}" -ge "${PUBLISHED_RUN_ATTEMPT}" ]; }; then
                SHOULD_MOVE=true
              fi
            else
              # What: Runs merge-base as its own statement rather than
              # directly as an elif condition.
              # Why: So a real error (an invalid object) is distinguished
              # from a genuine "not an ancestor" result, instead of both
              # reading as the same silent "false".
              set +e
              git merge-base --is-ancestor "${PUBLISHED_FULL_SHA}" "${BUILT_FULL_SHA}"
              ANCESTOR_STATUS=$?
              set -e
              if [ "${ANCESTOR_STATUS}" -eq 0 ]; then
                # What: The build in hand strictly descends from what's
                # published on current_dev.
                # Why: Genuinely newer content, regardless of which run
                # has the higher run_id.
                SHOULD_MOVE=true
              elif [ "${ANCESTOR_STATUS}" -gt 1 ]; then
                echo "::error::git merge-base --is-ancestor failed validating ${PUBLISHED_FULL_SHA} against ${BUILT_FULL_SHA} (exit ${ANCESTOR_STATUS}), not a plain \"not an ancestor\" result -- refusing to treat this as \"not newer\" and silently leave :latest stale."
                exit 1
              fi
            fi
          fi

          if [ "${SHOULD_MOVE}" = "true" ]; then
            docker tag distcc-ng-e2e:selftest "${IMAGE_BASE}:latest"
            docker push "${IMAGE_BASE}:latest"
          else
            # What: A deliberate, documented skip, logged as a notice, not
            # a warning or failure.
            # Why: AGENTS.md rule 31 governs unexpected problems, not an
            # intended skip like this one; the immutable tag pushed above
            # is still pullable either way.
            echo "::notice::this run's built commit (${BUILT_FULL_SHA}) is not newer than what :latest already points at (${PUBLISHED_SHA}, run ${PUBLISHED_RUN_ID} attempt ${PUBLISHED_RUN_ATTEMPT}); skipping the :latest move so it never regresses to an older or stale build."
          fi

  # What: Files/updates the standing nightly-broken issue on failure,
  # closes it on success, only for runs where this matters (schedule, or a
  # manual dispatch/current_dev push meant to publish) -- a PR's own
  # build_and_selftest failure already surfaces as a normal failed check.
  # Eligibility is re-derived directly from github.event_name/github.ref,
  # deliberately not from build_and_selftest's publish_eligible output.
  # Why: report's gate must survive the build failing before it could
  # produce any output at all (a checkout or identity-resolution failure);
  # depending on a job output would silently skip reporting exactly the
  # run that most needs it.
  # From: PR #476
  report:
    needs: [build_and_selftest, publish]
    if: >-
      ${{ always() && !cancelled() && github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/current_dev') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: current_dev
      - name: Compute which specific job(s) failed
        id: failed_jobs
        if: always()
        uses: ./.github/actions/failed-jobs
        with:
          jobs: |
            build_and_selftest=${{ needs.build_and_selftest.result }}
            publish=${{ needs.publish.result }}
      - uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ (needs.build_and_selftest.result == 'success' && needs.publish.result == 'success') && 'success' || 'failure' }}
          scope: e2e test image build+publish (distcc-ng-e2e)
          failed_jobs: ${{ steps.failed_jobs.outputs.list }}
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}
