# distcc-ng (https://github.com/wiki-mod/distcc-ng)
# What: Weekly base-image digest bumps for every Dockerfile.
# Why: target-branch takes one branch; each is listed twice.
# From: Issue #267, Issue #479
version: 2
updates:
  # What: Dependabot's own label plus the changelog opt-out.
  # Why: labels replaces defaults; a bump needs no CHANGELOG.
  # From: PR #492
  - package-ecosystem: docker
    directory: /docker/release
    target-branch: master
    schedule:
      interval: weekly
    labels: [dependencies, no-changelog-needed]
  - package-ecosystem: docker
    directory: /docker/release
    target-branch: current_dev
    schedule:
      interval: weekly
    labels: [dependencies, no-changelog-needed]

  - package-ecosystem: docker
    directory: /docker/verify
    target-branch: master
    schedule:
      interval: weekly
    labels: [dependencies, no-changelog-needed]
  - package-ecosystem: docker
    directory: /docker/verify
    target-branch: current_dev
    schedule:
      interval: weekly
    labels: [dependencies, no-changelog-needed]

  # What: Refresh the digest-pinned fuzz base image.
  # Why: A digest pin without bumps would freeze it forever.
  # From: Issue #267
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    target-branch: master
    schedule:
      interval: weekly
    labels: [dependencies, no-changelog-needed]
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    target-branch: current_dev
    schedule:
      interval: weekly
    labels: [dependencies, no-changelog-needed]
