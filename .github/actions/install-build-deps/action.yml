name: Install build/test apt dependencies
description: >-
  Shared apt package list (issue #362 item 6) for building distcc-ng and
  running make check -- c-build.yml's Linux matrix leg, nightly-publish.yml,
  and package-release.yml all needed the exact same list kept in sync by
  hand. A duplicated dependency list drifts silently: a package added for a
  new build requirement in one file and not the other produces a failure
  only in the workflow nobody edited. The apt path (issue #493) retries
  through a bounded per-attempt timeout instead of ConorMacBride/
  install-package's single, unretried `apt update` -- GitHub-hosted
  ubuntu-latest's default mirror has twice hung indefinitely and burned a
  whole job timeout with nothing to show for it. The brew path (macOS
  matrix legs, only c-build.yml uses it) is unaffected and still goes
  through ConorMacBride/install-package unchanged.

inputs:
  # What: The default apt list includes libelf-dev.
  # Why: Without it, configure's --with-libelf probe silently falls back
  #   to the pre-fix raw <elf.h> path, so make check's
  #   GdbCompressedDebugInfo_Case would exercise the still-broken
  #   behavior instead of the actual fix.
  # From: Issue #398, PR #487
  apt:
    description: >-
      Apt package list; defaults to make_check's own list so every existing
      caller keeps its current behavior unchanged.
    required: false
    default: >-
      clang libavahi-client-dev libpopt-dev gdb python3-dev
      python3-setuptools ccache libzstd-dev libelf-dev
  brew:
    description: >-
      Optional Homebrew package list, passed through unchanged for macOS
      matrix legs (only c-build.yml needs this).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # What: Installs the apt input's package list through a bounded retry
    #   loop (2 attempts, 3 minutes each, sudo wrapping timeout) instead
    #   of a single unretried `apt update`.
    # Why: GitHub-hosted ubuntu-latest's default azure.archive.ubuntu.com
    #   mirror has hung indefinitely twice, each time consuming the whole
    #   job timeout with zero retry; 2x3 worst-case minutes still leaves
    #   c-build.yml's 15-minute make_check room for the actual build.
    #   `sudo` must wrap `timeout`, not the reverse: the reverse ordering
    #   leaves a killed attempt's `apt-get` running as an orphan holding
    #   /var/lib/apt/lists/lock, breaking every later attempt. The
    #   package list comes from the apt input (not hardcoded here) so
    #   callers with a different build under test can override it without
    #   duplicating this step.
    # From: Issue #493, Issue #479
    - if: runner.os == 'Linux'
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt }}
      run: |
        max_attempts=2
        attempt=1
        while true; do
          if sudo timeout -k 10s 3m bash -c "apt-get update && apt-get install -y $APT_PACKAGES"; then
            exit 0
          fi
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "apt update/install did not succeed after $max_attempts attempts" >&2
            exit 1
          fi
          echo "apt update/install attempt $attempt failed or timed out, retrying" >&2
          attempt=$((attempt + 1))
          sleep 10
        done
    - if: runner.os == 'macOS'
      uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
      with:
        brew: ${{ inputs.brew }}
