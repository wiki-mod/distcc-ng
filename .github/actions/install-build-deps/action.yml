name: Install build/test apt dependencies
description: >-
  Shared apt package list (issue #362 item 6) for building distcc-ng and
  running make check -- c-build.yml's Linux matrix leg, nightly-publish.yml,
  and package-release.yml all needed the exact same list kept in sync by
  hand. A duplicated dependency list drifts silently: a package added for a
  new build requirement in one file and not the other produces a failure
  only in the workflow nobody edited. The apt path (issue #493) retries
  through a bounded per-attempt timeout instead of ConorMacBride/
  install-package's single, unretried `apt update` -- GitHub-hosted
  ubuntu-latest's default mirror has twice hung indefinitely and burned a
  whole job timeout with nothing to show for it. The brew path (macOS
  matrix legs, only c-build.yml uses it) is unaffected and still goes
  through ConorMacBride/install-package unchanged.

inputs:
  brew:
    description: >-
      Optional Homebrew package list, passed through unchanged for macOS
      matrix legs (only c-build.yml needs this).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # What: Installs the shared apt package list through a bounded retry
    #   loop (2 attempts, 3 minutes each) instead of a single unretried
    #   `apt update`.
    # Why: ConorMacBride/install-package (used below for brew) runs `sudo
    #   apt update` as one of its own composite-action steps, which can't
    #   be wrapped individually -- replacing the apt path with a plain
    #   shell equivalent is what makes it retryable at all. GitHub-hosted
    #   ubuntu-latest's default azure.archive.ubuntu.com mirror has hung
    #   indefinitely twice (issue #493), each time consuming the entire
    #   job timeout for zero retries; 2x3 worst-case minutes still leaves
    #   the smallest consumer job (c-build.yml's 15-minute make_check)
    #   comfortable room for the actual build even if both attempts time
    #   out. `sudo` wraps `timeout`, not the other way around, because
    #   `sudo`'s own pty/session handling for the command it execs can
    #   detach that command from a `timeout` that started *it* instead,
    #   letting a killed attempt's `apt-get` survive as an orphan holding
    #   /var/lib/apt/lists/lock -- confirmed live on this PR's own first
    #   CI run, where attempt 1's orphaned `apt-get` made attempts 2 and 3
    #   fail instantly on that same lock instead of getting a real retry.
    # From: Issue #493
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        # What: The package list includes libelf-dev.
        # Why: Without it, configure's --with-libelf probe silently falls
        #   back to the pre-fix raw <elf.h> path, so make check's
        #   GdbCompressedDebugInfo_Case would exercise the still-broken
        #   behavior on this leg instead of the actual fix.
        # From: Issue #398, PR #487
        packages="clang libavahi-client-dev libpopt-dev gdb python3-dev python3-setuptools ccache libzstd-dev libelf-dev"
        max_attempts=2
        attempt=1
        while true; do
          if sudo timeout -k 10s 3m bash -c "apt-get update && apt-get install -y $packages"; then
            exit 0
          fi
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "apt update/install did not succeed after $max_attempts attempts" >&2
            exit 1
          fi
          echo "apt update/install attempt $attempt failed or timed out, retrying" >&2
          attempt=$((attempt + 1))
          sleep 10
        done
    - if: runner.os == 'macOS'
      uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
      with:
        brew: ${{ inputs.brew }}
