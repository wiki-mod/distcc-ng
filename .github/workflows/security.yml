# distcc-ng (https://github.com/wiki-mod/distcc-ng)
# SPDX-License-Identifier: GPL-2.0-or-later
# What: Consolidated security scans (CodeQL, OSV, Scorecard, fuzz).
# Why: Cutover-draft; workflow_dispatch-only until it replaces the
#   legacy scan workflows (running both would double-upload SARIF).
# From: Issue #479
name: Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          INPUT_LANGUAGES: ${{ matrix.language }}
          INPUT_QUERIES: security-extended
        run: bash .github/scripts/ci.sh action run github/codeql-action/init
      - if: matrix.language == 'c-cpp'
        uses: ./.github/actions/install-build-deps
        with:
          apt: "autoconf automake libavahi-client-dev libpopt-dev python3-dev python3-setuptools"
      - if: matrix.language == 'c-cpp'
        env:
          VARIANT: default
        run: bash .github/scripts/ci.sh build "$VARIANT"
      - env:
          INPUT_CATEGORY: /language:${{ matrix.language }}
        run: bash .github/scripts/ci.sh action run github/codeql-action/analyze

  osv-scan:
    name: OSV scan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          INPUT_RESULTS_FILE: results.sarif
          INPUT_RESULTS_FORMAT: sarif
          INPUT_PUBLISH_RESULTS: "false"
        run: bash .github/scripts/ci.sh action run ossf/scorecard-action
      - env:
          INPUT_NAME: scorecard-results
          INPUT_PATH: results.sarif
          INPUT_RETENTION-DAYS: "5"
        run: bash .github/scripts/ci.sh action run actions/upload-artifact
      - env:
          INPUT_SARIF_FILE: results.sarif
        run: bash .github/scripts/ci.sh action run github/codeql-action/upload-sarif

  clusterfuzzlite:
    name: ClusterFuzzLite fuzzing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true

  openssf:
    name: OpenSSF Baseline recheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGE_DELETE_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: "312"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/ci.sh scan openssf
