name: Update CHANGELOG.md on release

# Completes the automated changelog chain: release-drafter (see
# release-drafter.yml) keeps a draft GitHub Release current on every push
# to current_dev; once a maintainer actually publishes that release, this
# workflow inserts its notes into CHANGELOG.md and commits the result --
# no manual git-cliff pass needed anymore (see #122, which replaced that
# approach).
#
# Tags are cut from current_dev's tip (doc/release-versioning.md), so the
# published release's commit is on current_dev's history -- this workflow
# checks out and commits to current_dev explicitly, regardless of which
# ref GitHub resolves the release event against, since current_dev is
# where the changelog needs to keep accumulating.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to insert into CHANGELOG.md (this workflow has no release event context when run manually, so it must be given explicitly -- e.g. to retry after a failed automatic run)"
        required: true
        type: string
      release_notes:
        description: "Release notes body to insert (same content GitHub shows on the release page)"
        required: true
        type: string
  # `published` fires for every draft->public transition regardless of how
  # the release was originally created; `released` is a real GitHub quirk
  # documented as unreliable specifically when the release started life as
  # a draft (github/community#26954) -- which is always true here, since
  # package-release.yml's publish_github_release job promotes an existing
  # release-drafter draft rather than creating a release directly. Using
  # `released` would have left this workflow unable to fire even after
  # switching off the default GITHUB_TOKEN.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update_changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # nightly-publish.yml also publishes a real GitHub release (its
    # `nightly` pre-release channel) -- exclude it here so a prerelease
    # publish never inserts a nightly build into CHANGELOG.md, which only
    # tracks real vX.Y.Z-NG releases.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: current_dev

      # `latest-version` keeps its real vX.Y.Z-NG tag (with the `v`), since
      # the action also uses it to build its `release_compare_url`/
      # `unreleased_compare_url` outputs, which need the real git tag to
      # resolve. `heading-text` is this repo's own X.Y.Z-NG convention
      # (no `v`, matching every existing `## [X.Y.Z-NG]` CHANGELOG.md
      # section and doc/release-versioning.md) -- confirmed via the
      # action's own action.yml that `heading-text` exists specifically to
      # override the heading independently of `latest-version`, defaulting
      # to `latest-version` verbatim when unset (which would otherwise
      # write `## [vX.Y.Z-NG]`, not this repo's real format).
      - name: Compute the CHANGELOG heading version (no v prefix)
        id: heading
        run: |
          set -euo pipefail
          raw_tag="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          echo "version=${raw_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Insert release notes into CHANGELOG.md
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
        with:
          latest-version: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
          heading-text: ${{ steps.heading.outputs.version }}
          release-notes: ${{ github.event.inputs.release_notes || github.event.release.body }}

      - name: Commit updated CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "CHANGELOG.md: add ${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          file_pattern: CHANGELOG.md
          branch: current_dev
