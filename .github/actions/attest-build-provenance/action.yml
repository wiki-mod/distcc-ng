name: Build provenance attestation
description: >-
  Single source of truth for actions/attest-build-provenance -- the one
  external action with no CLI/native replacement (Issue #479): minting a
  real Sigstore-signed attestation needs the job's own OIDC id-token
  exchange, which only exists inside the GitHub Actions runtime itself,
  the same structural exception this repo already carries for
  step-security/harden-runner (see that action's own file). Callers use
  the local `./` form (unlike harden-runner, this always runs after a
  real checkout, so no self-repository `$/` syntax is needed).

inputs:
  subject-path:
    description: "Newline- or glob-separated paths to the built artifacts to attest"
    required: true

runs:
  using: composite
  steps:
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ inputs.subject-path }}
