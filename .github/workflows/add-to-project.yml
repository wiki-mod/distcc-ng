name: Add to project board

# What: Adds newly opened issues/PRs to the project board
#   (https://github.com/orgs/wiki-mod/projects/11 -- kept in sync with
#   PROJECT_OWNER/PROJECT_NUMBER's defaults in
#   .github/actions/nightly-status/report.sh; update both together).
# Why: The default GITHUB_TOKEN can't write to an org-owned Projects v2
#   board, so this needs a PROJECT_AUTOMATION_PAT secret; the presence
#   check runs in its own earlier step because GitHub Actions disallows
#   the `secrets` context in any `if:` condition, and actions/add-to-project
#   itself errors on a blank token rather than skipping gracefully.
# From: AGENTS.md rule 3, PR #329

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add to distcc-ng project board
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/harden-runner
      - name: Check for automation PAT
        id: check-pat
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
        run: |
          if [ -n "$PROJECT_AUTOMATION_PAT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add issue/PR to project board
        if: steps.check-pat.outputs.available == 'true'
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/wiki-mod/projects/11
          github-token: ${{ secrets.PROJECT_AUTOMATION_PAT }}
