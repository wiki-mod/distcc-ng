name: C build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # What: push is restricted to the two long-lived branches; pull_request
  # stays unfiltered by branch to cover every PR commit; no paths-ignore
  # exists at the workflow level (removed 2026-07-24) -- the `changes` job
  # below does that filtering itself, at the job level.
  # Why: Without the branch filter, pushing to an in-repo PR branch fired
  # this AND pull_request's synchronize event for the same commit, running
  # the full matrix twice; a workflow-level paths-ignore permanently
  # blocked merging any PR that didn't touch a matching path, since a
  # required check that never runs can never pass (confirmed live on PR
  # #336). A skipped job's check-run counts as passing for required-status
  # purposes, so per-job filtering keeps every required check-run real.
  # From: Issue #267, PR #336
  push:
    branches:
      - current_dev
      - master
  # What: Explicit types (GitHub's default omits ready_for_review).
  # Why: A PR that never got an initial pull_request-event run for its
  # `opened` activity (confirmed live on release PR #461, root cause not
  # established) gets one real chance to self-heal when later marked
  # ready for review, instead of requiring a manual workflow_dispatch.
  # From: PR #461
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # What: Lets a branch's build health be checked on demand.
  # Why: Without this, checking current_dev/master would need a new
  # commit or PR to trigger CI.
  workflow_dispatch:
  # What: Nightly health check on current_dev.
  # Why: So a break doesn't sit silently until the next PR touches that
  # branch.
  schedule:
    - cron: '0 3 * * *'

# What: Read-only floor; every job below already declares its own
# job-level permissions block scoped to what its own steps need.
# Why: So a future job added without its own block falls back to this
# explicit minimal default instead of the broader legacy GITHUB_TOKEN
# default.
permissions:
  contents: read

jobs:
  # What: Cheap, always-runs gate replacing the old workflow-level
  # paths-ignore (see the `on:` block above) with a per-job one; every
  # heavy job below depends on this and skips, rather than never starting,
  # when only docs changed.
  # Why: workflow_dispatch/schedule always force a full run, since those
  # exist specifically to check real build health on demand and must
  # never silently no-op.
  changes:
    name: Detect relevant (non-docs) changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # What: Harden Runner is added to this job too.
      # Why: Cheap enough here (checkout + a git diff, no build/install/
      # network-facing tooling) that the runtime-doubling cost/benefit
      # call favors adding it.
      # From: Issue #361
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        uses: $/.github/actions/changed-files
      - id: filter
        env:
          FORCED: ${{ steps.diff.outputs.forced }}
          CHANGED: ${{ steps.diff.outputs.changed_files }}
        run: |
          set -euo pipefail
          if [ "$FORCED" = "true" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -qvE '\.md$|^doc/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  make_check:
    needs: changes
    # What: No job-level `if:` here, unlike the other gated jobs below;
    # every step is gated instead, keeping the matrix expansion intact.
    # Why: A matrixed job's `if:` evaluates before the matrix expands, so
    # a false job-level `if:` collapses both legs into one check-run
    # instead of the two named contexts master's ruleset requires,
    # silently losing the required checks again on a docs-only PR
    # (confirmed live on PR #336, after PR #337/#338 had already "fixed"
    # this once).
    # From: PR #336, PR #337, PR #338
    strategy:
      matrix:
        os:
        - macOS-latest
        - ubuntu-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # What: Declares id-token/attestations alongside contents:read.
    # Why: Needed for actions/attest-build-provenance below (Linux only
    # for now); contents:read must be restated here or it's lost by
    # declaring this block at all.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # What: Pins CCACHE_DIR explicitly.
    # Why: ccache's own default cache_dir differs by platform
    # (~/.cache/ccache on Linux, ~/Library/Caches/ccache on macOS); pinning
    # it keeps the actions/cache path below correct on both matrix legs.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-dir
    steps:
      # What: Trial run, audit-only egress monitoring; must be the very
      # first step.
      # Why: It can't retroactively cover network calls made by steps
      # that already ran.
      # From: Issue #58
      - if: needs.changes.outputs.relevant == 'true'
        uses: $/.github/actions/harden-runner
      - if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # What: Redirects a schedule-triggered run to current_dev.
          # Why: schedule always evaluates using the default branch
          # (master); push/pull_request already cover master on every
          # change.
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
      - if: needs.changes.outputs.relevant == 'true'
        uses: $/.github/actions/install-build-deps
        with:
          # What: Includes automake (for aclocal) but no gdb entry.
          # Why: Homebrew packages aclocal with automake even though
          # automake itself isn't used; gdb isn't supported on arm64 macOS.
          brew: autoconf automake popt python@3.13 python-setuptools ccache zstd
          # brew-cask: TODO
          # choco: TODO
      - if: needs.changes.outputs.relevant == 'true'
        run: which python3.13 || which python3
      # What: Caches ccache's own object cache (content-addressed), using
      # a rolling key that always restores the latest for this OS and
      # always saves a new one.
      # Why: A stale/missing cache never produces wrong results, only a
      # slower build; bumping github.run_id into the key keeps the cache
      # warm since actions/cache no-ops a save on an exact key collision.
      - if: needs.changes.outputs.relevant == 'true'
        uses: $/.github/actions/ccache-cache
        with:
          path: ${{ env.CCACHE_DIR }}
          key-prefix: ccache-${{ matrix.os }}
      # What: Caches autom4te.cache (autoconf/aclocal's macro-trace
      # cache), keyed on the real autoconf inputs; deliberately does not
      # cache config.cache.
      # Why: autom4te self-invalidates a stale macro trace when its m4
      # input changed, so restoring it even when stale is safe; unlike
      # that, config.cache's ac_cv_* entries are blindly trusted once
      # cached and can go stale silently when a dependency's availability
      # changes without configure.ac itself changing.
      - if: needs.changes.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: autom4te.cache
          key: autoconf-${{ matrix.os }}-${{ hashFiles('configure.ac', 'm4/*.m4') }}
          restore-keys: |
            autoconf-${{ matrix.os }}-
      - if: needs.changes.outputs.relevant == 'true'
        run: ./autogen.sh
      # What: Pins PYTHON to 3.13 (macOS's default 3.14 breaks CI here for
      # unknown reasons) and passes CC as ccache's absolute path.
      # Why: `make check`'s maintainer-check-no-set-path target runs
      # `$(CC) --version` under a restricted PATH that deliberately
      # excludes Homebrew's /opt/homebrew/bin, where a bare "ccache" would
      # fail to resolve.
      - if: needs.changes.outputs.relevant == 'true'
        run: ./configure CC="$(command -v ccache) cc" PYTHON="$(which python3.13 || which python3)"
      - if: needs.changes.outputs.relevant == 'true'
        run: make
      - if: needs.changes.outputs.relevant == 'true'
        run: ccache --show-stats
      - if: needs.changes.outputs.relevant == 'true'
        run: make check
      # What: Reruns AutogroupNicenessPrivilegeDrop_Case under sudo,
      # Linux-only, rather than re-running the whole suite as root; fails
      # explicitly on NOTRUN or any unexpected result instead of trusting
      # the process exit code.
      # Why: The plain `make check` above always runs unprivileged, so
      # this root-only case would be silently NOTRUN there, and comfychair
      # treats a skip as a plain exit 0 identical to a real pass -- a
      # future runner missing autogroup support would stay green while
      # providing zero real coverage.
      # From: Issue #264
      - if: needs.changes.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          set -o pipefail
          sudo make TESTNAME=AutogroupNicenessPrivilegeDrop_Case single-test 2>&1 | tee autogroup-test.log
          if grep -q "AutogroupNicenessPrivilegeDrop_Case NOTRUN" autogroup-test.log; then
            echo "::error::AutogroupNicenessPrivilegeDrop_Case was skipped (NOTRUN) instead of actually running -- this runner is missing real root/autogroup coverage, which this step exists to guarantee. See the skip reason above."
            exit 1
          fi
          grep -q "AutogroupNicenessPrivilegeDrop_Case OK" autogroup-test.log \
            || { echo "::error::AutogroupNicenessPrivilegeDrop_Case did not report OK or NOTRUN -- unexpected output, treating as a failure."; exit 1; }
      # What: Build-provenance attestation for the shipped binaries,
      # Linux-only, skipped on the nightly schedule.
      # Why: The OIDC-based attestation API is simplest to exercise from
      # one runner OS rather than duplicating it per matrix leg; a
      # scheduled run checks out current_dev while github.sha (what the
      # attestation records) is master's tip, which would tie the
      # attestation to the wrong commit.
      - if: needs.changes.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest' && github.event_name != 'schedule'
        run: |
          mkdir -p /tmp/attest-subjects
          cp distcc distccd /tmp/attest-subjects/
      - if: needs.changes.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest' && github.event_name != 'schedule'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: /tmp/attest-subjects/*

  # What: Proves the bundled-popt fallback (configure.ac, popt/) actually
  # builds and passes the test suite; the explicit grep on configure's own
  # notice guards against this silently degrading to a no-op if a future
  # base image ships popt.pc by default.
  # Why: This runner deliberately never installs libpopt-dev, so popt.pc
  # is absent and PKG_CHECK_MODULES(POPT, ...) must fail over to the
  # bundled copy.
  popt_fallback_build:
    name: Bundled popt fallback build (no system libpopt)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # What: Only checks out and builds the tree.
    # Why: Doesn't need anything beyond read access to repository
    # contents.
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # What: Redirects a schedule-triggered run to current_dev, same
          # as make_check/coverage/distributed_e2e/sanitizer_check.
          # Why: schedule always evaluates using the default branch
          # (master); otherwise this job would test master while the
          # `report` job labels the aggregated outcome as current_dev.
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
      - uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
        with:
          # What: Deliberately excludes libpopt-dev/libpopt0 while
          # installing pkg-config and libavahi-client-dev.
          # Why: pkg-config present with popt.pc absent is the realistic
          # case this job exercises, more representative than pkg-config
          # itself being missing; libavahi-client-dev keeps the default
          # zeroconf-enabled build configuring the same as the main matrix.
          apt: autoconf automake pkg-config libavahi-client-dev python3-dev python3-setuptools libzstd-dev
      - run: ./autogen.sh
      - name: configure (must report the bundled-popt fallback)
        run: |
          ./configure PYTHON="$(which python3)" 2>&1 | tee configure.log
          grep -q "system libpopt not found (or disabled); building bundled popt" configure.log \
            || { echo "::error::configure did not report falling back to bundled popt -- is libpopt-dev leaking in from the base image?"; exit 1; }
      - run: make
      - run: make check
      # What: Real functional smoke test of the bundled-popt-linked
      # binary, not just a successful link.
      # Why: --help exercises poptGetContext()/poptGetNextOpt() end to
      # end against a representative sample of src/dopt.c's real
      # options[] entry types, so a real argInfo/parsing regression in
      # the vendored popt tree shows up as missing/garbled output here.
      - name: Functional smoke test (distccd --help against bundled popt)
        run: |
          ./distccd --help > distccd-help.log 2>&1
          echo "--- distccd --help output ---"
          cat distccd-help.log
          for opt in '\-\-jobs' '\-\-nice' '\-\-listen' '\-\-daemon' '\-\-log-file' '\-\-allow' '\-\-user' '\-\-port'; do
            grep -qE -- "$opt" distccd-help.log \
              || { echo "::error::distccd --help (bundled popt build) is missing expected option matching '$opt'"; exit 1; }
          done

  # What: Compiles the current vendored popt/*.c directly with gcc,
  # independent of the full autoconf/make machinery, at this project's own
  # -Wall -Wextra -Werror plus the same -Wno-unused/-Wno-unused-parameter
  # exemption Makefile.in's popt_OBJS rule applies in the real build.
  # Why: Requested after the bundled popt/ tree was found to be a
  # 20+-year-old 1.7 snapshot; the version-marker and fingerprint check
  # below (not the compile itself, since the unused-parameter exemption is
  # load-bearing even for a correct, unmodified 1.19 tree) is what
  # actually catches a stale or wrong vendored copy.
  # From: Issue #63
  popt_vendor_check:
    name: Vendored popt/ version and compile check
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # What: Read-only checkout and compile.
    # Why: Same rationale as popt_fallback_build above; no need for the
    # default token's write access to anything.
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # What: Redirects a schedule-triggered run to current_dev, same
          # as make_check/coverage/distributed_e2e/sanitizer_check.
          # Why: schedule always evaluates using the default branch
          # (master); otherwise this job would test master while the
          # `report` job labels the aggregated outcome as current_dev.
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
      - name: Vendored version marker matches what this repo claims to ship
        run: |
          test "$(cat popt/POPT_VERSION)" = "popt-1.19-release" \
            || { echo "::error::popt/POPT_VERSION does not read 'popt-1.19-release' -- has the vendored tree been swapped without updating the marker?"; exit 1; }
          # What: Checks for poptJlu32lpair in popt/poptint.h.
          # Why: It only exists in upstream popt's modern (post-1.7)
          # hash-table implementation, so it's a real, checkable
          # fingerprint that the vendored tree is genuinely 1.19-era, not
          # just a renamed marker file.
          grep -q "poptJlu32lpair" popt/poptint.h \
            || { echo "::error::popt/poptint.h is missing poptJlu32lpair -- vendored tree does not look like popt 1.19"; exit 1; }
          # What: Checks that findme.c/.h are absent.
          # Why: They were part of the old 1.7 snapshot and dropped when
          # vendoring 1.19; their reappearance signals an accidental
          # revert to the stale tree.
          if [ -e popt/findme.c ] || [ -e popt/findme.h ]; then
            echo "::error::popt/findme.c or popt/findme.h exist -- this looks like a reversion to the old popt 1.7 snapshot"
            exit 1
          fi
      - uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
        with:
          # What: Same package set as popt_fallback_build (no libpopt-dev).
          # Why: config.h needs to end up with the real
          # BUILD_POPT-triggering macros this job's compile reflects.
          apt: autoconf automake pkg-config libavahi-client-dev python3-dev python3-setuptools libzstd-dev
      # What: Runs the real ./configure, forced onto the bundled path.
      # Why: So config.h reflects the actual HAVE_* results this job's
      # compile uses; a hand-written set of -D flags could silently drift
      # from what configure.ac really detects.
      - run: ./autogen.sh
      - run: ./configure --without-system-popt PYTHON="$(which python3)"
      - name: Compile vendored popt/*.c under this project's own warning flags
        run: |
          set -e
          mkdir -p /tmp/popt-strict-check
          # What: Every flag here (-Wno-unused/-Wno-unused-parameter,
          # -D_GNU_SOURCE, -DPOPT_SYSCONFDIR, -DPACKAGE) mirrors
          # Makefile.in's own CPPFLAGS/popt_OBJS rule exactly.
          # Why: Each is load-bearing for the real build: -D_GNU_SOURCE
          # exposes glibc's secure_getenv() prototype, POPT_SYSCONFDIR and
          # PACKAGE feed compiled-in values this fork's plain-autoconf
          # configure.ac never defines on its own, and the warning
          # exemptions match inherent, unmodified popt 1.19 source (see
          # the job-level comment above).
          CFLAGS=(-DHAVE_CONFIG_H -D_GNU_SOURCE "-DPOPT_SYSCONFDIR=\"/usr/local/etc\"" "-DPACKAGE=\"distcc\"" -Isrc -Ipopt -Wall -Wextra -Werror -Wno-unused -Wno-unused-parameter)
          for f in popt/popt.c popt/poptconfig.c popt/popthelp.c popt/poptparse.c popt/poptint.c; do
            echo "::group::gcc ${CFLAGS[*]} -c $f"
            gcc "${CFLAGS[@]}" -c "$f" -o "/tmp/popt-strict-check/$(basename "$f").o"
            echo "::endgroup::"
          done

  # What: Statement-coverage measurement for the real test suite (OpenSSF
  # Best Practices Badge "test_most" criterion), published as a job
  # summary table plus a build artifact rather than via a third-party
  # service. Kept as a separate job, not folded into make_check.
  # Why: GitHub's native coverage feature isn't available on this org's
  # Free plan; gcov instrumentation changes what's being measured
  # (unoptimized, extra profiling counters), so this job's output is a
  # coverage report only, never the pass/fail gate -- make_check's own
  # uninstrumented build remains the actual required check.
  coverage:
    name: Test coverage (gcov/lcov, job summary + artifact)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # What: Read-only checkout.
    # Why: The job summary write goes through $GITHUB_STEP_SUMMARY and the
    # artifact upload uses actions/upload-artifact's own default token
    # scope; nothing here needs elevated permission.
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # What: Same schedule redirect as make_check/distributed_e2e
          # above.
          # Why: The nightly run evaluates from master but must measure
          # current_dev, since that is where real development happens.
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
      - uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
        with:
          # What: Includes libseccomp-dev.
          # Why: So configure's optional seccomp check finds it and
          # defines HAVE_SECCOMP; otherwise src/sandbox-seccomp.c compiles
          # only its no-op fallback, contributing nothing to coverage.
          apt: autoconf automake libavahi-client-dev libpopt-dev python3-dev python3-setuptools libzstd-dev libseccomp-dev lcov python3-coverage
      - run: ./autogen.sh
      # What: --coverage (-fprofile-arcs -ftest-coverage plus libgcov)
      # with -O0; PYTHON stays a plain interpreter; --with-seccomp is
      # passed explicitly.
      # Why: -O0 keeps gcov's line/branch attribution accurate;
      # $(PYTHON) is also used at build time and a coverage-instrumented
      # override breaks those callers outright; --with-seccomp turns a
      # missing libseccomp-dev into a hard configure failure instead of a
      # silent fallback that would quietly shrink what this job measures.
      - run: ./configure PYTHON="$(command -v python3)" CFLAGS="--coverage -O0" LDFLAGS="--coverage" --with-seccomp
      - run: make
      # What: Creates a real, single-token executable wrapper instead of
      # a multiword PYTHON override.
      # Why: Makefile.in passes $(PYTHON) as a single token everywhere
      # (e.g. subprocess.check_output() receives it as an executable
      # name), so a multiword override is never re-split and fails as a
      # program literally named with spaces.
      - name: Create a coverage-recording PYTHON wrapper
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/coverage-python-wrapper" <<EOF
          #!/bin/sh
          # What: Passes a -c invocation straight through to a real,
          # uninstrumented interpreter.
          # Why: 'coverage run' doesn't understand -c the way plain
          # python does, and that one-line version-probe use isn't part
          # of include_server's own code anyway.
          if [ "\$1" = "-c" ]; then
            exec "$(command -v python3)" "\$@"
          fi
          # What: --source is an absolute path.
          # Why: Makefile.in's include-server test loop cd's into
          # include_server/ before invoking the PYTHON override, so a
          # relative path would resolve against the already-cd'd cwd and
          # match nothing.
          exec python3-coverage run --append --source="$GITHUB_WORKSPACE/include_server" "\$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/coverage-python-wrapper"
      # What: Overrides PYTHON only at this `make check` invocation, not
      # at configure/make above.
      # Why: Otherwise include_server/*.py, a real production component,
      # would be silently absent from the coverage denominator; the
      # extension is already built by this point, so nothing needs its
      # build_ext step re-run.
      - run: make check PYTHON="$GITHUB_WORKSPACE/coverage-python-wrapper"
      # What: Reruns AutogroupNicenessPrivilegeDrop_Case under sudo
      # against the same already-built, coverage-instrumented binaries,
      # failing outright on NOTRUN or any non-OK result.
      # Why: The plain `make check` above runs unprivileged, so this
      # root-only case (mirroring make_check's own rerun) would otherwise
      # be silently NOTRUN and its instrumented lines never recorded
      # before lcov captures below.
      - name: Run the root-only case against the instrumented binaries
        run: |
          set -o pipefail
          sudo make TESTNAME=AutogroupNicenessPrivilegeDrop_Case single-test 2>&1 | tee autogroup-test.log
          if grep -q "AutogroupNicenessPrivilegeDrop_Case NOTRUN" autogroup-test.log; then
            echo "::error::AutogroupNicenessPrivilegeDrop_Case was skipped (NOTRUN) -- this runner is missing real root/autogroup coverage that this coverage job exists to measure."
            exit 1
          fi
          grep -q "AutogroupNicenessPrivilegeDrop_Case OK" autogroup-test.log \
            || { echo "::error::AutogroupNicenessPrivilegeDrop_Case did not report OK or NOTRUN -- unexpected output, treating as a failure."; exit 1; }
      - name: Capture C coverage data with lcov
        run: |
          set -euo pipefail
          # What: branch_coverage=1 replaces the deprecated
          # lcov_branch_coverage RC name; geninfo_unexecuted_blocks=1
          # resolves lcov's own unexecuted-block warning; no
          # --ignore-errors is passed.
          # Why: This project's real coverage data needs neither
          # "mismatch" nor "negative" suppression, and blanket-ignoring
          # either would let a genuinely corrupt report upload silently.
          lcov --capture --directory . --output-file coverage_raw.info \
            --rc branch_coverage=1 --rc geninfo_unexecuted_blocks=1
          # What: Removes only lzo/ and src/h_*.c, with no popt/, test/,
          # or /usr/* pattern.
          # Why: This criterion covers this project's own shipped code
          # only; the other three paths never produce a .gcda of their
          # own in this job, so an unmatched removal pattern would be a
          # real error here (AGENTS.md rule 76), not something to
          # silently accept.
          lcov --remove coverage_raw.info \
            '*/lzo/*' '*/src/h_*.c' \
            --output-file coverage.info \
            --rc branch_coverage=1
          lcov --list coverage.info --rc branch_coverage=1
      - name: Generate Python (include-server) coverage report
        run: |
          set -euo pipefail
          cd include_server
          # What: --append (inside the wrapper above) accumulates every
          # test_*.py invocation into one .coverage data file directly.
          # Why: Unlike --parallel-mode's per-process files, there is
          # nothing here for `coverage combine` to merge.
          python3-coverage xml -o ../coverage-python.xml
          python3-coverage report
      - name: Publish coverage summary to the job summary
        run: |
          set -euo pipefail
          {
            echo "## Coverage report"
            echo
            echo "### C (lcov)"
            echo '```'
            lcov --list coverage.info --rc branch_coverage=1
            echo '```'
            echo
            echo "### Python (include_server)"
            echo '```'
            (cd include_server && python3-coverage report)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # What: Keeps the C/Python reports as a downloadable build artifact
      # alongside the job summary table above, no third-party service.
      # Why: Both are native GitHub Actions features, needing no external
      # account or secret.
      - name: Upload coverage reports as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            coverage.info
            coverage-python.xml
          retention-days: 90

  # What: Real distributed-compile validation across two containers (a
  # distccd server + a distcc client) over a bridge network, in both
  # plain and pump mode, checked byte-for-byte against a local-only
  # compile. Linux/docker-only, so it's a standalone job, not a macOS leg.
  # Why: make check already exercises a localhost daemon, but only this
  # proves a compile genuinely crosses the network rather than being
  # silently completed by distcc's local-fallback path.
  distributed_e2e:
    name: Distributed compile E2E (2-container)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # What: Only checks out the repo and runs a local docker-compose e2e
    # script, pinned to contents:read.
    # Why: This job's sibling jobs all declare an explicit job-level
    # block; without one here it inherited the default token scope, which
    # CodeQL flagged (actions/missing-workflow-permissions).
    permissions:
      contents: read
    steps:
      # What: Trial run, audit-only egress monitoring.
      # Why: See the make_check job's identical first step for the full
      # rationale.
      # From: Issue #58
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # What: Same schedule redirect as make_check.
          # Why: The nightly run evaluates from master but must validate
          # current_dev.
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
      # What: No install step for docker/compose.
      # Why: Both are preinstalled on ubuntu-latest.
      - uses: $/.github/actions/distributed-e2e-test

  # What: Opt-in ASan/UBSan sanitizer build; never runs on
  # push/pull_request, only workflow_dispatch/schedule.
  # Why: Unlike make_check's schedule leg, this is not a per-commit gate;
  # it exists to catch new memory-safety/UB regressions on a relaxed
  # cadence, not to block every change.
  # From: Issue #266
  sanitizer_check:
    name: ASan/UBSan sanitizer check (opt-in)
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # What: Same schedule redirect as the other jobs above.
          # Why: The nightly run evaluates from master but must validate
          # current_dev.
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
      - uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
        with:
          apt: autoconf automake libavahi-client-dev libpopt-dev python3-dev python3-setuptools libzstd-dev
      - run: ./autogen.sh
      # What: --without-seccomp (orthogonal to this job's checks);
      # -fno-sanitize-recover=address paired with
      # -fsanitize-recover=undefined; -Wno-stringop-truncation;
      # -fno-sanitize=alignment.
      # Why: A real memory-safety violation should always be fatal while
      # UBSan prints and continues so one report doesn't mask the rest of
      # the run; -Wno-stringop-truncation works around a sanitizer-only
      # -Werror false positive in dcc_trim_path(), not a real bug;
      # -fno-sanitize=alignment accepts bundled lzo/minilzo.c's deliberate
      # unaligned loads/stores as permanent, known noise, the same
      # rationale as detect_leaks=0 below.
      # From: Issue #266
      - run: |
          ./configure CFLAGS="-O2 -fsanitize=address,undefined -fno-sanitize=alignment -fno-sanitize-recover=address -fsanitize-recover=undefined -fno-omit-frame-pointer -g -Wno-stringop-truncation" PYTHON="$(which python3)" --without-seccomp
      - run: make
      # What: ASAN_OPTIONS sets detect_leaks=0 and
      # verify_asan_link_order=0.
      # Why: This project's client-side allocation pattern (short-lived,
      # OS-reclaimed at exit) was triaged as not a bug (see PR #352), so
      # leak detection would just re-report an already-accepted class;
      # the include-server C extension loads into a plain, uninstrumented
      # python3 for its own maintainer-check test, which otherwise fails
      # ASan's link-order check without actually missing instrumentation.
      # From: Issue #266, PR #352
      - run: |
          ASAN_OPTIONS=detect_leaks=0:verify_asan_link_order=0 UBSAN_OPTIONS=print_stacktrace=1 make check

  # What: Files/updates the standing nightly-broken issue on a failed
  # scheduled (03:00 UTC) run, closes it on success, reusing the same
  # composite action nightly-publish.yml/master-heartbeat.yml already use
  # (AGENTS.md rule 69); scoped to the schedule event only, and needs
  # `changes` itself plus the 6 real jobs.
  # Why: push/pull_request failures already surface through the normal
  # PR/commit check UI; `changes` can fail on its own independent of its
  # forced-relevant schedule path, and omitting it from `needs` would
  # report that as six unrelated skipped-job failures with no visible
  # root cause.
  # From: PR #476
  report:
    needs:
      [
        changes,
        make_check,
        popt_fallback_build,
        popt_vendor_check,
        coverage,
        distributed_e2e,
        sanitizer_check,
      ]
    if: ${{ always() && !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: $/.github/actions/harden-runner
      # What: Pins ref to current_dev on schedule, same as the other jobs
      # in this file and nightly-publish.yml's own `report` job.
      # Why: An unpinned checkout on `schedule` resolves to master, not
      # current_dev, and matters here specifically because `uses:
      # ./.github/actions/nightly-status` below is a local-path action
      # reference -- whichever branch gets checked out is the version of
      # that action's code that actually runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'current_dev' || github.ref }}
      - name: Compute which specific job(s) failed
        id: failed_jobs
        if: always()
        run: |
          set -euo pipefail
          # What: Flags only a job whose result is literally
          # failure/cancelled, not merely "not success".
          # Why: If `changes` itself fails, the 6 real jobs below all show
          # "skipped", not "failure", as a consequence; a plain "!=
          # success" check would report six unrelated failures with the
          # actual root cause missing from the list.
          # From: PR #476
          failed=""
          add_if_failed() {
            case "$2" in
              failure|cancelled) failed="${failed} $1" ;;
            esac
          }
          add_if_failed changes "${{ needs.changes.result }}"
          add_if_failed make_check "${{ needs.make_check.result }}"
          add_if_failed popt_fallback_build "${{ needs.popt_fallback_build.result }}"
          add_if_failed popt_vendor_check "${{ needs.popt_vendor_check.result }}"
          add_if_failed coverage "${{ needs.coverage.result }}"
          add_if_failed distributed_e2e "${{ needs.distributed_e2e.result }}"
          add_if_failed sanitizer_check "${{ needs.sanitizer_check.result }}"
          echo "list=${failed# }" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/nightly-status
        with:
          outcome: ${{ (needs.changes.result == 'success' && needs.make_check.result == 'success' && needs.popt_fallback_build.result == 'success' && needs.popt_vendor_check.result == 'success' && needs.coverage.result == 'success' && needs.distributed_e2e.result == 'success' && needs.sanitizer_check.result == 'success') && 'success' || 'failure' }}
          scope: nightly health check (current_dev)
          failed_jobs: ${{ steps.failed_jobs.outputs.list }}
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}

