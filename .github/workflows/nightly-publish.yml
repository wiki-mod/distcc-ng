name: Nightly build and publish (current_dev)

# What: Builds, tests, e2e-validates, and publishes a moving "nightly"
# channel from current_dev (packages, the distcc-ng-nightly GHCR image, a
# nightly GitHub pre-release), overwritten on every successful run; kept
# separate from package-release.yml's real vX.Y.Z-NG tagged-release path.
# Why: schedule/workflow_dispatch only fire from the workflow copy on the
# default branch (master), so this activates only after the next
# current_dev->master promotion; every job checks out current_dev
# explicitly regardless of the trigger's branch.

concurrency:
  group: nightly-publish
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # What: One hour after c-build.yml's 03:00 UTC nightly health check.
    - cron: '0 4 * * *'
    # --- DISABLED: full_bidirectional_e2e's own weekly schedule --------------
    # What: A disabled weekly schedule (Fridays 02:00 CET = 01:00 UTC,
    # WORKLOAD=apache) for full_bidirectional_e2e, kept commented out
    # rather than deleted so the intended cadence stays visible in code.
    # Why: Arming it is a separate, not-yet-made decision. DO NOT UNCOMMENT
    # without the maintainer's explicit go-ahead: a weekly full
    # third-party-project build is a real, non-trivial CI cost commitment.
    # From: Issue #264
    # - cron: '0 1 * * 5'

# What: Top-level permissions are read-only; the real write scopes (moving
# the nightly tag, creating/replacing its release, pushing the GHCR image)
# live only on the publish job's own block below.
# Why: build_check and distributed_e2e are pure build/test gates that never
# touch the GitHub API or a registry and shouldn't inherit write access
# they never use.
permissions:
  contents: read

env:
  # What: Hardcoded, never derived; the only tag this workflow may
  # force-move.
  # Why: Must never collide with a real vX.Y.Z-NG release tag.
  NIGHTLY_TAG: nightly

jobs:
  # --- Gate 1: real build + full make check on current_dev ------------------
  build_check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # What: Only checks out current_dev and runs a local build+test.
    # Why: No GitHub API or registry write happens here, hence read-only.
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-dir
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: current_dev
      - uses: $/.github/actions/build-and-check
        with:
          cache-key-prefix: ccache-nightly
          autoconf-cache-key-prefix: autoconf-nightly

  # --- Gate 2: real distributed-compile e2e (reuses the committed harness) --
  distributed_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # What: Only checks out current_dev and runs the local docker-compose
    # e2e script.
    # Why: No GitHub API or registry write happens here, hence read-only.
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: current_dev
      - uses: $/.github/actions/distributed-e2e-test

  # --- Publish, only if BOTH gates passed -----------------------------------
  publish:
    needs: [build_check, distributed_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # What: Needs both write scopes the top-level block used to grant every
    # job: contents:write to force-move the nightly tag and create/replace
    # its release, packages:write to push distcc-ng-nightly:latest to GHCR.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: current_dev
          # What: Full history checkout.
          # Why: So the nightly tag can be force-moved onto this commit.
          fetch-depth: 0

      - uses: $/.github/actions/install-packaging-deps

      - name: Resolve the built commit
        # What: Stamps the image/release with the commit actually checked
        # out and built (current_dev's tip), not github.sha.
        # Why: Under schedule/workflow_dispatch the workflow evaluates from
        # the default branch, so github.sha is master's tip even though
        # current_dev is what gets built; using it would make the
        # provenance metadata dishonest.
        run: echo "BUILT_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Build release packages
        run: ./scripts/build-release-packages.sh

      - uses: $/.github/actions/ghcr-login
        with:
          token: ${{ github.token }}

      - name: Build and push the distcc-ng-nightly:latest container image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/distcc-ng-nightly:latest
        run: |
          docker build \
            --file docker/release/Dockerfile \
            --build-arg "VCS_REF=${BUILT_SHA}" \
            --build-arg "VERSION=nightly" \
            --tag "${IMAGE_TAG}" \
            .
          docker push "${IMAGE_TAG}"

      - name: Move the nightly tag and (re)publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/distcc-ng-nightly:latest
        run: |
          set -euo pipefail
          # What: Hard stop if NIGHTLY_TAG was ever mis-set to a real
          # release tag.
          case "${NIGHTLY_TAG}" in
            v*) echo "refusing to force-move a v* tag" >&2; exit 1 ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${NIGHTLY_TAG}"
          git push -f origin "refs/tags/${NIGHTLY_TAG}"

          shopt -s nullglob
          assets=(distcc-*.tar.gz distcc-*.tar.bz2 packaging/*.rpm packaging/*.deb)

          notes_file="$(mktemp)"
          # What: The backticks below are literal Markdown code spans for
          # the release notes, not command substitution.
          # Why: Otherwise shellcheck's SC2016 flags them as unintended.
          # shellcheck disable=SC2016
          {
            printf 'Automated nightly build of `current_dev` (%s).\n\n' "${BUILT_SHA}"
            printf 'Unstable nightly channel -- this is NOT a real release and carries no vX.Y.Z-NG tag. It is overwritten on every successful nightly run.\n\n'
            printf 'Container image: %s\n' "${IMAGE_TAG}"
          } > "${notes_file}"

          # What: Recreates the release each run so its target follows the
          # moved tag.
          # Why: --latest=false keeps it from ever outranking a real
          # tagged release.
          if gh release view "${NIGHTLY_TAG}" --repo wiki-mod/distcc-ng >/dev/null 2>&1; then
            gh release delete "${NIGHTLY_TAG}" --repo wiki-mod/distcc-ng --yes
          fi
          gh release create "${NIGHTLY_TAG}" "${assets[@]}" \
            --repo wiki-mod/distcc-ng \
            --title "distcc-ng nightly" \
            --notes-file "${notes_file}" \
            --prerelease \
            --latest=false \
            --target "${BUILT_SHA}"

  # --- Full bidirectional native-compatibility E2E (issue #264) -------------
  # What: The "full automated distributed-build E2E test" from issue #264's
  # design, distinct from c-build.yml's quick two-container distributed_e2e
  # check; placed in this file per AGENTS.md rule 61 rather than a new
  # workflow file, and deliberately outside publish's own concurrency/needs
  # chain.
  # Why: This job is independent manual verification, not a release gate,
  # and must never block or be blocked by the nightly publish chain; the
  # `if` below restricts it to workflow_dispatch so the daily schedule
  # never silently grows a full Samba build onto it.
  # From: Issue #264
  full_bidirectional_e2e:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # What: A full, unrestricted four-leg Samba build is expected to run
    # long, which is why issue #264's design uses workflow_dispatch only,
    # never a per-PR/push gate.
    # Why: GITHUB_ACTIONS_MAX_JOB_TIMEOUT (360 minutes on GitHub-hosted
    # runners) is the real ceiling; WAF_TARGETS below bounds this CI leg to
    # fit it, while test/e2e-full/README.md documents running the full
    # build on the project's own hosts.
    # From: Issue #264
    timeout-minutes: 340
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # What: No explicit ref; github.sha/github.ref is whatever the
        # dispatcher picked (current_dev in production, or a feature
        # branch to prove the job out before it merges).
        # Why: This job is workflow_dispatch-only, unlike this file's
        # schedule-triggered jobs, which must redirect off the default
        # branch explicitly.
      - name: Run the full bidirectional native-compatibility E2E matrix
        env:
          WORKLOAD: samba
          # What: Bounds this CI leg to a real subset (see
          # test/e2e-full/README.md) so it finishes within timeout-minutes.
          # Why: Only affects the CI-hosted run; a manual run on a project
          # host with WAF_TARGETS unset gets the full, unrestricted build.
          WAF_TARGETS: "replace,ldb,tdb,talloc,tevent"
        run: bash test/e2e-full/run-bidirectional-e2e.sh

  # --- Failure/recovery reporting -------------------------------------------
  # What: Separate job with needs: on every other job and if: always();
  # files or updates the standing nightly-broken issue on failure, closes
  # it on success.
  # Why: So it fires even when a gate fails and `publish` is skipped -- a
  # step inside publish would never run on the most important failure.
  # From: PR #476
  report:
    needs: [build_check, distributed_e2e, publish]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    # What: Job-level permissions replace the top-level set.
    # Why: This job only needs to read the tree (for the composite action)
    # and write issues.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: $/.github/actions/harden-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: current_dev
      - name: Compute which specific job(s) failed
        id: failed_jobs
        if: always()
        uses: ./.github/actions/failed-jobs
        with:
          jobs: |
            build_check=${{ needs.build_check.result }}
            distributed_e2e=${{ needs.distributed_e2e.result }}
            publish=${{ needs.publish.result }}
      - uses: ./.github/actions/nightly-status
        with:
          # What: Success only if all three jobs succeeded.
          # Why: Any failure/skip is a failure worth reporting.
          outcome: ${{ (needs.build_check.result == 'success' && needs.distributed_e2e.result == 'success' && needs.publish.result == 'success') && 'success' || 'failure' }}
          scope: nightly build+publish (current_dev)
          failed_jobs: ${{ steps.failed_jobs.outputs.list }}
          project_pat: ${{ secrets.PROJECT_AUTOMATION_PAT }}
