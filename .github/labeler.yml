# Path-based auto-labeling config for actions/labeler (see
# .github/workflows/labeler.yml). Adapted from wiki-mod/lancache-ng's own
# .github/labeler.yml -- reduces, but does not replace, AGENTS.md rule 3's
# requirement that a PR carry at least one label -- this can only infer
# which area changed from file paths, it has no way to know the correct
# issue Type or Milestone. Only maps to labels that already exist in this
# repository's real label set (verified via `gh api repos/wiki-mod/distcc-ng/labels`),
# same principle lancache-ng's own config follows. Keep in sync with the
# label list in repository settings and with the directories referenced
# here when either changes.

documentation:
  # CHANGELOG.md is excluded via a separate `all:` condition, not a
  # negated entry inside the same any-glob-to-any-file OR-list (that first
  # attempt was wrong -- Codex review finding on PR #353: any-glob-to-any-file
  # ORs its entries, so "!CHANGELOG.md" ORed in just adds "any changed file
  # that isn't literally named CHANGELOG.md" as its own always-true-ish
  # match for any multi-file PR, while CHANGELOG.md itself still separately
  # satisfies "**/*.md" -- neither half of that actually subtracts anything).
  # This is actions/labeler's own documented exclusion pattern (see its
  # README's "EXCEPT for the docs sub-folder" example): `all:` requires
  # both the positive match (doc/** or any .md file) AND the negated
  # all-globs-to-all-files check (every changed file must satisfy
  # "!CHANGELOG.md", i.e. none of them is CHANGELOG.md) to hold. Almost
  # every PR touches CHANGELOG.md per changelog-check.yml's requirement,
  # which made "documentation" fire on nearly every PR regardless of what
  # it actually changed -- it describes what changed, not how to use the
  # project, so it doesn't belong in the same bucket as doc/** or a real
  # README/doc .md file.
  - all:
      - changed-files:
          - any-glob-to-any-file:
              - "doc/**"
              - "**/*.md"
          - all-globs-to-all-files: "!CHANGELOG.md"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - "packaging/**"
          - "docker/**"

pump:
  - changed-files:
      - any-glob-to-any-file: "include_server/**"

seccomp:
  - changed-files:
      - any-glob-to-any-file:
          - "src/sandbox-seccomp.*"
          - "src/sandbox-config.*"

zstd:
  - changed-files:
      - any-glob-to-any-file: "src/compress-zstd.c"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "src/config-parser.*"
          - "src/client-config.*"
