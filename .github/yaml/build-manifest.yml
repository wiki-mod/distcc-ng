# distcc-ng (https://github.com/wiki-mod/distcc-ng)
# SPDX-License-Identifier: GPL-2.0-or-later
# What: Single source of truth for CI build inputs.
# Why: One machine-readable owner ends version drift.
# From: Issue #479
schema: build-manifest/v1

# What: Pinned external base images by full digest.
# Why: Sole owner of every base-image pin, no per-file copy.
# From: Issue #479
base_images:
  # What: Debian base of the verify/build-tools image.
  # Why: docker/verify consumes this; one owner only.
  # From: Issue #479
  debian_verify: "debian@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4"
  # What: Debian base of the release runtime images.
  # Why: docker/release consumes this; distinct from verify.
  # From: Issue #479
  debian_release: "debian@sha256:d07d1b51c39f51188e60be9b64e6bf769fa94e187f092bc32b91305cfa34ba5a"
  # What: Go base that builds the pinned actionlint binary.
  # Why: verify's actionlint-builder stage consumes it.
  # From: Issue #479
  golang_actionlint: "golang@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea"
  # What: OSS-Fuzz builder base of the ClusterFuzzLite image.
  # Why: :v1 lineage; its old glibc matches the host check.
  # From: Issue #267, Issue #479, PR #544
  oss_fuzz_base_builder: "gcr.io/oss-fuzz-base/base-builder@sha256:5d8ad2d0945830c9cae00441202025e0609eb2d846e351a3217cb5355c1f2109"
  # What: ClusterFuzzLite build/run step images run by ci.sh.
  # Why: Pinned by digest, not the floating v1 tag.
  # From: Issue #267, Issue #479, PR #544
  cfl_build_fuzzers: "gcr.io/oss-fuzz-base/clusterfuzzlite-build-fuzzers@sha256:9407058df630a7f8af9c8f371abc6aacae8362dd99e68b40a06fa0ea75caec2e"
  cfl_run_fuzzers: "gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers@sha256:f8223bc628dc8c5cd458ae1a58ba6e5fdc5d6b3831f3f5fe737f3a6e9f1c2021"

# What: Pinned external tool/asset versions.
# Why: Central version owner; consumers never re-pin.
# From: Issue #479
external_versions:
  # What: The vendored popt/ tree's expected identity.
  # Why: vendor-check compares it to POPT_VERSION.
  # From: Issue #479
  popt_vendor:
    version: "wiki-mod/popt-ng@5f853169618cdd8fb42d6550a683c864d94d7617 (1.19.1)"
  # What: Samba release used by the source-adequacy check.
  # Why: verify configure-dryrun downloads exactly this tag.
  # From: Issue #479
  samba:
    version: "4.22.4"
  # What: actionlint release built into the verify image.
  # Why: pins the workflow linter to one reproducible build.
  # From: Issue #479
  actionlint:
    version: "1.7.12"
  # What: ccache release built by the weekly heartbeat.
  # Why: heartbeat/control build the same revision.
  # From: Issue #479, Issue #81
  ccache_heartbeat:
    version: "v4.13.6"
  # What: CodeQL CLI bundle, downloaded/run by ci.sh.
  # Why: codeql-action's tag names its own bundle.
  # From: Issue #479
  codeql_cli:
    version: "v2.27.0"
  # What: OSSF Scorecard CLI release run directly by ci.sh.
  # Why: Replaces ossf/scorecard-action.
  # From: Issue #479
  scorecard:
    version: "v5.5.0"
  # What: OSV-Scanner CLI release run directly by ci.sh.
  # Why: Replaces google/osv-scanner-action.
  # From: Issue #479
  osv_scanner:
    version: "v2.6.0"
  # What: autoconf built into the ClusterFuzzLite image.
  # Why: configure.ac needs 2.71; base-builder apt ships 2.69.
  # From: Issue #267, Issue #479, PR #544
  autoconf:
    version: "2.71"
    sha256: "431075ad0bf529ef13cb41e9042c542381103e80015686222b8a9d4abef42a1c"
  # What: Trivy CLI release run directly by ci.sh.
  # Why: Replaces aquasecurity/trivy-action.
  # From: Issue #479
  trivy:
    version: "v0.74.0"
  # What: Syft CLI release ci.sh runs for SBOM gen.
  # Why: Replaces anchore/sbom-action.
  # From: Issue #479
  syft:
    version: "v1.52.0"
  # What: StepSecurity agent tarball run by ci.sh harden.
  # Why: Org has no TLS inspection: non-TLS agent, amd64 only.
  # From: Issue #479, PR #544
  harden_runner_agent:
    version: "v0.16.2"
    sha256: "4b14d8a3a5fbcef95af55e0c54d3bee6f44da802878c10289a4ca0b79b6d0237"

# What: harden-runner policy and StepSecurity endpoints.
# Why: Audit-only egress monitoring, never block (Issue #58).
# From: Issue #479, PR #544, Issue #58
harden_runner:
  egress_policy: "audit"
  api_url: "https://agent.api.stepsecurity.io/v1"
  telemetry_url: "https://prod.app-api.stepsecurity.io/v1"
  web_url: "https://app.stepsecurity.io"

# What: Pinned external service images used by CI steps.
# Why: Full-digest pin, never a floating tag anywhere.
# From: Issue #479
external_services:
  redis: "redis@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576"

# What: The configure variants CI builds/tests, per OS.
# Why: One matrix owner; workflows read, never hardcode.
# From: Issue #479
build_matrix:
  variants:
    # What: Plain configure PYTHON=python3, make check.
    # Why: The baseline gate; the only variant run on macOS.
    # From: Issue #479
    default:
      os: ["ubuntu-latest", "macos-latest"]
      apt: "clang libavahi-client-dev libpopt-dev gdb python3-dev python3-setuptools ccache libzstd-dev libelf-dev"
      brew: "autoconf automake popt python@3.13 python-setuptools ccache zstd"
    # What: Bundled popt fallback, no system libpopt.
    # Why: Proves the vendored-popt path still compiles.
    # From: Issue #479
    popt-fallback:
      os: ["ubuntu-latest"]
      apt: "autoconf automake pkg-config libavahi-client-dev python3-dev python3-setuptools libzstd-dev"
    # What: Vendored popt/ version and compile check.
    # Why: Guards the vendored popt source against drift.
    # From: Issue #479
    popt-vendor:
      os: ["ubuntu-latest"]
      apt: "autoconf automake pkg-config libavahi-client-dev python3-dev python3-setuptools libzstd-dev"
    # What: gcov/lcov coverage build, job-summary output.
    # Why: One coverage owner; ubuntu-only toolchain.
    # From: Issue #479
    coverage:
      os: ["ubuntu-latest"]
      apt: "autoconf automake libavahi-client-dev libpopt-dev python3-dev python3-setuptools libzstd-dev libseccomp-dev lcov python3-coverage"
    # What: ASan/UBSan sanitizer build, opt-in only.
    # Why: Not a required gate; runs on dispatch/schedule.
    # From: Issue #479
    sanitizer:
      os: ["ubuntu-latest"]
      opt_in: true
      apt: "autoconf automake libavahi-client-dev libpopt-dev python3-dev python3-setuptools libzstd-dev"

# What: The shipped release artifacts.
# Why: One inventory owner for packages and images.
# From: Issue #479
release:
  # What: Published images: file, stage, ARG=SOT-path, OCI text.
  # Why: An implicit last stage once changed what was published.
  # From: Issue #181, Issue #359, Issue #479, PR #544
  images:
    distcc-ng:
      dockerfile: "docker/release/Dockerfile"
      target: "runtime"
      args: ["DEBIAN_IMAGE=base_images.debian_release"]
      description: "distcc-ng runtime image."
    distcc-ng-pump:
      dockerfile: "docker/release/Dockerfile"
      target: "runtime-pump"
      args: ["DEBIAN_IMAGE=base_images.debian_release"]
      description: "distcc-ng runtime image with pump mode enabled."
    distcc-ng-nightly:
      dockerfile: "docker/release/Dockerfile"
      target: "runtime"
      args: ["DEBIAN_IMAGE=base_images.debian_release"]
      description: "distcc-ng nightly runtime image from current_dev."
    # What: ref is the published tag lint and e2e run on.
    # Why: tag is this job's local build of the same image.
    # From: Issue #264, Issue #479, PR #544
    distcc-ng-buildtools:
      dockerfile: "docker/verify/Dockerfile"
      target: "verify"
      args: ["DEBIAN_IMAGE=base_images.debian_verify", "GOLANG_IMAGE=base_images.golang_actionlint"]
      description: "distcc-ng build, debug and verification image."
      tag: "distcc-ng-buildtools:local"
      ref: "ghcr.io/wiki-mod/distcc-ng-buildtools:latest"
  # What: apt packages of the release build and runtime stages.
  # Why: libelf for --with-libelf; vendored popt: no libpopt.
  # From: Issue #398, PR #487, PR #504
  image_build_apt: "autoconf automake build-essential ccache libelf-dev libseccomp-dev libzstd-dev pkg-config python3-dev python3-setuptools"
  image_runtime_apt: "build-essential libelf1 libseccomp2 libzstd1 python3"
  licenses: "GPL-2.0-or-later"
  # What: Canonical GHCR package names this repo owns.
  # Why: One owner for gc/tag construction; no hardcode.
  # From: Issue #479
  ghcr_packages: ["distcc-ng", "distcc-ng-pump", "distcc-ng-nightly", "distcc-ng-buildtools", "distcc-ng-e2e"]
  # What: apt packages to build the real .rpm/.deb packages.
  # Why: One owner; nightly/release both install this.
  # From: Issue #362, Issue #479
  packaging_apt: "autoconf automake build-essential elfutils fakeroot libelf-dev libpopt-dev libseccomp-dev libzstd-dev pkg-config python3-dev python3-setuptools rpm alien"

# What: The repo's GitHub Projects (v2) board identity.
# Why: One owner; no repo Variables needed for a fixed value.
# From: Issue #236, Issue #479, PR #544
project_board:
  owner: "wiki-mod"
  number: "11"

# What: apt packages CodeQL needs for a c-cpp build.
# Why: One owner; security.yml installs this first.
# From: Issue #479
security:
  codeql_cpp_apt: "autoconf automake libavahi-client-dev libpopt-dev python3-dev python3-setuptools"
  # What: apt packages of the ClusterFuzzLite build image.
  # Why: src/auth.h needs gssapi.h, so libkrb5-dev is required.
  # From: Issue #267, Issue #479, PR #544
  cfl_image_apt: "automake libtool pkg-config libpopt-dev libavahi-client-dev libzstd-dev libseccomp-dev python3-dev python3-setuptools libkrb5-dev"
  # What: Local tag of the SOT base-builder; the CFL FROM.
  # Why: CFL passes no build-args, so ci.sh tags the pin first.
  # From: Issue #267, Issue #479, PR #544
  cfl_base:
    from: "base_images.oss_fuzz_base_builder"
    tag: "distcc-ng-cfl-base:local"

# What: verify image apt groups atop the default matrix apt.
# Why: The image builds what CI builds, plus debug tools.
# From: Issue #264, PR #273, PR #291, Issue #479, PR #544
verify:
  apt:
    # What: gcc and autotools beside the matrix clang.
    # Why: dcc_probe_is_clang needs both compiler families.
    # From: PR #273, Issue #264
    toolchain: "build-essential autoconf automake libtool pkg-config libseccomp-dev"
    # What: Debuggers, tracers, valgrind, binutils.
    # Why: py-bt for the include server needs python3-dbg.
    # From: PR #273, PR #291, Issue #264
    debug: "python3-dbg strace ltrace valgrind binutils"
    # What: A representative Samba build-dependency subset.
    # Why: Proves the image builds a large real C project.
    # From: Issue #264
    samba: "libkrb5-dev libldap2-dev libgnutls28-dev libpam0g-dev libsystemd-dev libicu-dev liblmdb-dev libacl1-dev libbsd-dev libcap-dev libjansson-dev libreadline-dev libtirpc-dev libcups2-dev libdbus-1-dev libarchive-dev libblkid-dev libcmocka-dev libgpgme11-dev libkeyutils-dev libpcap-dev libtasn1-6-dev libtasn1-bin liburing-dev zlib1g-dev bison flex docbook-xml docbook-xsl xsltproc perl libparse-yapp-perl python3-dnspython python3-markdown"
    # What: Search, fetch, socket, DNS and lint tools.
    # Why: Verification inside the container needs them.
    # From: PR #273, PR #291, Issue #267
    tools: "ripgrep grep less git ca-certificates wget curl lsof iproute2 dnsutils shellcheck jq"
    # What: sshd and ssh for SSHMode_Case.
    # Why: Without them SSHMode_Case NOTRUN-skips here.
    # From: Issue #275, Issue #440
    ssh: "openssh-server openssh-client"

# What: apt packages the engine self-test job needs.
# Why: One owner; validate.yml installs this first.
# From: Issue #479
ci_engine:
  selftest_apt: "bats parallel"

# What: GHCR prune policy applied by ci.sh gc.
# Why: Keeps a rollback set; only whole series groups age out.
# From: Issue #479, PR #544
gc:
  keep_untagged: 3
  series_tag_regex: "^manual-([0-9]+)(-amd64|-arm64)?$"
  keep_series: 2

# What: e2e modes: client:server legs, passes, floor.
# Why: One harness; floor objects = the build's .o count.
# From: Issue #479, Issue #264, Issue #81, PR #544
e2e:
  modes:
    distributed:
      legs: ["ng:ng"]
      passes: ["plain", "pump"]
      workload: "self-compile"
      extra: ""
      floor: 5
      server_warnings: "fail"
      max_attempts: 1
    heartbeat:
      legs: ["ng:ng"]
      passes: ["plain"]
      workload: "ccache"
      extra: ""
      floor: 20
      server_warnings: "fail"
      max_attempts: 2
    # What: full reports the ng server warning scan as NotRun.
    # Why: waf conf_check probes abort by design; logged as ERROR.
    # From: Issue #264, PR #544
    full:
      legs: ["ng:native", "native:ng"]
      passes: ["plain", "pump"]
      workload: "samba"
      extra: "replace,ldb,tdb,talloc,tevent"
      floor: "objects"
      server_warnings: "notrun"
      max_attempts: 1
  # What: ng builds the checkout; native is Debian's distcc.
  # Why: Both sit on the published buildtools toolchain.
  # From: Issue #264, Issue #479, PR #544
  images:
    ng:
      dockerfile: "test/e2e/Dockerfile"
      target: "ng"
      args: ["TOOLCHAIN_IMAGE=release.images.distcc-ng-buildtools.ref"]
      tag: "distcc-ng-e2e-ng:local"
    native:
      dockerfile: "test/e2e/Dockerfile"
      target: "native"
      args: ["TOOLCHAIN_IMAGE=release.images.distcc-ng-buildtools.ref"]
      tag: "distcc-ng-e2e-native:local"
  image_apt: "cmake libhiredis-dev procps"
  native_apt: "distcc distcc-pump"

# What: Diff path-classes and the ci.sh phases they select.
# Why: DEFAULT=NOOP; a docs-only diff selects no compile.
# From: Issue #479
impact_classes:
  c-source:
    paths: ["src/**", "**/*.c", "**/*.h", "configure.ac", "Makefile.in"]
    phases: ["build", "test", "e2e", "coverage", "analyze", "scan"]
  include-server:
    paths: ["include_server/**", "**/*.py"]
    phases: ["build", "test", "analyze"]
  packaging:
    paths: ["packaging/**"]
    phases: ["package"]
  docker:
    paths: ["docker/**"]
    phases: ["container", "verify"]
  fuzz:
    paths: ["src/**", "test/fuzz/**", ".clusterfuzzlite/**"]
    phases: ["fuzz"]
  workflows:
    paths: [".github/workflows/**", ".github/yaml/**"]
    phases: ["lint"]
  ci-engine:
    paths: [".github/scripts/**"]
    phases: ["selftest", "lint", "container", "verify", "e2e"]
  e2e-harness:
    paths: ["test/e2e/**"]
    phases: ["e2e"]
  governance:
    paths: ["AGENTS.md", "CLAUDE.md", ".github/AGENTS.md"]
    phases: ["lint"]
  docs:
    paths: ["**/*.md", "doc/**"]
    phases: ["doc-lint"]
