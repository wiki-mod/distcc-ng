# Path-based auto-labeling config for actions/labeler (see
# .github/workflows/labeler.yml). Adapted from wiki-mod/lancache-ng's own
# .github/labeler.yml -- reduces, but does not replace, AGENTS.md rule 3's
# requirement that a PR carry at least one label -- this can only infer
# which area changed from file paths, it has no way to know the correct
# issue Type or Milestone. Only maps to labels that already exist in this
# repository's real label set (verified via `gh api repos/wiki-mod/distcc-ng/labels`),
# same principle lancache-ng's own config follows. Keep in sync with the
# label list in repository settings and with the directories referenced
# here when either changes.

documentation:
  # CHANGELOG.md must not be *sufficient* on its own to trigger this label
  # (almost every PR touches it, per changelog-check.yml's requirement --
  # it describes what changed, not how to use the project, so it doesn't
  # belong in the same bucket as doc/** or a real README/doc .md file), but
  # a genuine documentation PR that also updates CHANGELOG.md (routine,
  # given that requirement) must still get the label. Two earlier attempts
  # got this wrong: an any-glob-to-any-file OR-list with a negated entry
  # doesn't subtract anything (ORing conditions, not filtering files), and
  # an all: + all-globs-to-all-files: "!CHANGELOG.md" condition requires
  # *every* changed file to not be CHANGELOG.md -- which also suppresses
  # the label for the routine doc-PR-plus-changelog-entry case, not just
  # the changelog-only case.
  #
  # This uses any: to OR two independent conditions: doc/** on its own, or
  # all-globs-to-any-file (a single changed file that satisfies *all* the
  # listed globs at once) against ["**/*.md", "!CHANGELOG.md"] -- i.e. some
  # one file that both is a .md file and is not CHANGELOG.md. That fires
  # for any real doc .md file regardless of whether CHANGELOG.md is also
  # among the changed files, and never fires for CHANGELOG.md alone (it
  # can't simultaneously satisfy "**/*.md" and "not CHANGELOG.md").
  - any:
      - changed-files:
          - any-glob-to-any-file: "doc/**"
      - changed-files:
          - all-globs-to-any-file:
              - "**/*.md"
              - "!CHANGELOG.md"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - "packaging/**"
          - "docker/**"

pump:
  - changed-files:
      - any-glob-to-any-file: "include_server/**"

seccomp:
  - changed-files:
      - any-glob-to-any-file:
          - "src/sandbox-seccomp.*"
          - "src/sandbox-config.*"

zstd:
  - changed-files:
      - any-glob-to-any-file: "src/compress-zstd.c"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "src/config-parser.*"
          - "src/client-config.*"
